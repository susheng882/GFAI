# HTTPS 覆盖层：与 docker-compose.yml 叠加使用（不要单独启动本文件）
# 前置：
#   1) cp nginx-ssl.conf.example nginx-ssl.conf，把 your.domain.com 换成真实域名
#   2) mkdir -p certs && chmod 700 certs
#      将证书链放 certs/fullchain.pem、私钥放 certs/privkey.pem（chmod 600）
#   3) 证书未就位前不要启动本覆盖层；未拿到证书前 G3 不算完成
# 启动：docker compose -f docker-compose.yml -f docker-compose.ssl.yml up -d --force-recreate
# 验证：见 HTTPS_SETUP.md 第四步（curl / 浏览器锁标志 / Cookie Secure / HSTS）
services:
  nginx:
    volumes:
      # 证书挂载：宿主机 ./certs → 容器 /etc/nginx/certs（只读，与 nginx-ssl.conf 中的路径一致）
      - ./nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"    # 仅用于 301 跳转（ACME challenge 需单独放行）
      - "443:443"

  app:
    environment:
      # Cookie Secure：HTTPS 下会话 Cookie 才带 Secure 标志（HttpOnly/SameSite 由 app 自身设置）
      COOKIE_SECURE: "true"
      # 改成你的真实域名（多个来源用逗号分隔）；未改会导致浏览器 CORS 失败
      CORS_ORIGINS: "https://your.domain.com"
      # 注意：MinIO 预签名直传走 9000 端口，其 HTTPS 需单独为 MinIO 配证书或经 nginx 反代；
      # 本覆盖层不改 MINIO_SECURE / MINIO_PUBLIC_ENDPOINT，避免证书未就绪时直传失效。
