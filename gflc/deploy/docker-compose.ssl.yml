# HTTPS 覆盖层：与 docker-compose.yml 叠加使用
# 前置：cp nginx-ssl.conf.example nginx-ssl.conf，编辑域名；mkdir certs 放入 fullchain.pem/privkey.pem
# 启动：docker compose -f docker-compose.yml -f docker-compose.ssl.yml up -d
services:
  nginx:
    volumes:
      - ./nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"

  app:
    environment:
      COOKIE_SECURE: "true"
      # 改成你的真实域名
      CORS_ORIGINS: "https://your.domain.com"
