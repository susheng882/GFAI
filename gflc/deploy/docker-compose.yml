# GFLC P0 单机编排
# 逻辑三容器：nginx（网关）/ app（API+Worker 同镜像分进程）/ data（数据库+向量）
# data 域实际拆为 db(pgvector) + minio(对象存储) + redis(队列/会话) 三个进程，便于独立备份与配额。
name: gflc

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gflc
      POSTGRES_PASSWORD: gflc
      POSTGRES_DB: gflc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gflc -d gflc"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  app:
    build: ../backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  pgdata:
  miniodata:
