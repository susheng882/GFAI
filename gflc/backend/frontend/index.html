<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GFLC · 成长向前</title>
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<script defer src="/vendor/katex/katex.min.js"></script>
<script defer src="/vendor/katex/contrib/auto-render.min.js"></script>
<style>
  /* ============================================================
     GFLC · 纸墨设计系统 (unslop pass 1-9)
     方向：纸、墨、荧光笔 —— 温和、精确、像学习记录本
     所有尺寸走 4px 栅格；字重只用 400/500；一个强调色（墨蓝）
     ============================================================ */
  :root{
    /* 圆角：--radius 单一事实源，其余派生（shadcn 单源派生规则） */
    --radius:8px;
    --r-xs:calc(var(--radius) * .5);   /* 4  控件小 */
    --r-sm:calc(var(--radius) * .75);  /* 6  小圆角 */
    --r-md:var(--radius);              /* 8  输入/按钮 */
    --r-lg:calc(var(--radius) * 1.5);  /* 12 卡片 */
    --r-xl:calc(var(--radius) * 1.75); /* 14 面板 */

    /* 纸墨中性阶（暖纸） */
    --background:#f7f4ee;
    --foreground:#1f1b16;
    --fg-2:#4a4238;
    --card:#fdfbf7;
    --card-foreground:#1f1b16;
    --secondary:#efe9df;
    --secondary-foreground:#2b251e;
    --muted:#efe9df;
    --muted-foreground:#7b7266;
    --accent:#f0e9dc;
    --accent-foreground:#241f19;
    --sidebar:#f2ede4;
    --border:rgba(31,27,22,.10);
    --input:rgba(31,27,22,.15);

    /* 唯一强调色：墨蓝 */
    --primary:#1f4d6b;
    --primary-foreground:#fbf8f2;
    --ring:#1f4d6b;
    /* 主按钮用墨（不是蓝） */
    --btn:#26211b;
    --btn-fg:#fbf8f2;
    /* 荧光笔 */
    --mark:#f5df87;

    /* 语义色：只表意，压低饱和 */
    --destructive:#a8322c;
    --danger-soft:#f8e7e4;
    --success:#2f6b4f;
    --success-soft:#e7efe8;
    --warning:#8a6220;
    --warning-soft:#f7edda;
    --info:#1f4d6b;
    --info-soft:#e8eef2;

    /* 动效 token（transitions.dev：进慢出快，语义命名，禁止散落魔法数字） */
    --ease:cubic-bezier(.22,1,.36,1);          /* = --ease-smooth-out 万金油 */
    --t-fast:140ms; --t-mid:180ms; --t-slow:320ms;  /* 兼容既有过渡 */
    --dur-quick:150ms;   /* 关闭 / 文字切换 / tooltip 现 */
    --dur-fast:250ms;    /* 打开 / tabs 滑动 */
    --dur-medium:350ms;  /* 面板 / 强调入场 */
    --blur-sm:2px;       /* 交叉溶解模糊档 */

    /* 等宽：只给数字、时间戳、代码 */
    --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  .dark{
    --background:#0f0e0c;
    --foreground:#ece5d8;
    --fg-2:#bcb3a3;
    --card:#1c1915;
    --card-foreground:#ece5d8;
    --secondary:#272219;
    --secondary-foreground:#ece5d8;
    --muted:#272219;
    --muted-foreground:#978d7c;
    --accent:#2e281e;
    --accent-foreground:#ece5d8;
    --sidebar:#0a0908;
    --border:rgba(236,229,216,.13);
    --input:rgba(236,229,216,.18);

    --primary:#8ab4d0;
    --primary-foreground:#12100d;
    --ring:#8ab4d0;
    --btn:#ece5d8;
    --btn-fg:#1a1713;
    --mark:#6d5c22;

    --destructive:#e0776d;
    --danger-soft:#2a1c1a;
    --success:#6fb08c;
    --success-soft:#1a2420;
    --warning:#d8ab63;
    --warning-soft:#241f16;
    --info:#8ab4d0;
    --info-soft:#1a2026;
  }
  @supports not (color:color-mix(in srgb,red,blue)){
    :root{--border:#e6e0d4;--input:#ded7c9}
  }

  /* ---------- 基础 ---------- */
  *{box-sizing:border-box;border-color:var(--border)}
  html,body{height:100%;margin:0}
  body{
    background:var(--background);color:var(--foreground);
    font-family:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans CJK SC",
      -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:14px;line-height:1.6;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  button{font-family:inherit}
  ::selection{background:var(--mark);color:#241f19}
  :focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:var(--r-sm)}
  button:focus:not(:focus-visible){outline:none}
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
      transition-duration:.01ms!important;scroll-behavior:auto!important}
  }

  /* ---------- 骨架布局：真实应用比例 ---------- */
  .app{display:flex;min-height:100vh;background:var(--sidebar)}
  .sidebar{
    width:240px;flex:0 0 240px;background:var(--sidebar);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:16px 12px;
    position:sticky;top:0;height:100vh;
    transition:width var(--t-slow) var(--ease),flex-basis var(--t-slow) var(--ease);
  }
  .brand{display:flex;align-items:center;gap:8px;padding:4px 8px 20px;
    font-size:15px;font-weight:500;letter-spacing:0}
  .brand .logo{width:24px;height:24px;border-radius:var(--r-sm);background:var(--foreground);
    display:flex;align-items:center;justify-content:center;color:var(--background);
    font-size:13px;font-weight:500;letter-spacing:0}
  .brand .bt{white-space:nowrap}

  .nav{display:flex;flex-direction:column;gap:2px}
  .nav-g{margin-bottom:12px}
  .nav-t{font-size:11px;font-weight:400;letter-spacing:.2px;color:var(--muted-foreground);
    padding:8px 10px 4px}
  .nav a{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;
    border-radius:var(--r-md);color:var(--fg-2);text-decoration:none;
    font-size:14px;position:relative;cursor:pointer;
    transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
  .nav a:hover{background:var(--secondary);color:var(--foreground)}
  .nav a.active{background:var(--accent);color:var(--foreground);font-weight:500}
  .nav a.active::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:2px;
    border-radius:0 2px 2px 0;background:var(--primary)}
  .nav a .ic{display:inline-flex;align-items:center;justify-content:center;
    width:18px;height:18px;flex:0 0 18px;color:var(--muted-foreground);
    transition:color var(--t-fast) var(--ease)}
  .nav a .ic svg{display:block}
  .nav a:hover .ic{color:var(--fg-2)}
  .nav a.active .ic{color:var(--primary)}
  .nav a .lab{white-space:nowrap;overflow:hidden}

  .side-foot{margin-top:auto;padding:12px 4px 0;border-top:1px solid var(--border)}
  .userline{display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:12px;color:var(--muted-foreground)}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--secondary);
    color:var(--fg-2);display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:500}
  .sidebar .collapse-btn{width:24px;height:24px;padding:0;margin-left:auto;
    color:var(--muted-foreground);opacity:.6;transition:opacity var(--t-fast) var(--ease)}
  .sidebar .collapse-btn:hover{opacity:1;color:var(--foreground)}
  .sidebar.collapsed{width:64px!important;flex:0 0 64px!important;padding-left:8px;padding-right:8px}
  .sidebar.collapsed .bt,.sidebar.collapsed .lab,.sidebar.collapsed .nav-t,
  .sidebar.collapsed .userline .muted{display:none}
  .sidebar.collapsed .nav a{justify-content:center;padding:0}
  .sidebar.collapsed .nav a.active::before{left:-8px}
  .sidebar.collapsed .collapse-btn{transform:rotate(180deg);margin:0 auto}
  .sidebar.collapsed .brand{justify-content:center;padding-left:0;padding-right:0}
  .sidebar.collapsed .userline{flex-direction:column;gap:6px}
  .sidebar.collapsed #logout{padding:8px 0}
  .sidebar.collapsed #logout .ic{margin:0}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--background)}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:20px 32px 16px;border-bottom:1px solid var(--border);
    background:var(--background);position:sticky;top:0;z-index:10}
  .topbar h1{font-size:17px;font-weight:500;margin:0;letter-spacing:-.1px}
  .topbar .sub{color:var(--muted-foreground);font-size:12.5px;margin-top:2px;line-height:1.5}
  .content{padding:24px 32px 64px;max-width:1400px;width:100%;margin:0 auto}

  /* ---------- 基础元件 ---------- */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px}
  .card.tight{padding:16px}
  .muted{color:var(--muted-foreground)}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .between{justify-content:space-between}
  .grid{display:grid;gap:16px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:860px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
  h2.sec{font-size:13px;font-weight:500;margin:28px 0 12px;letter-spacing:0;color:var(--fg-2)}
  h2.sec:first-child{margin-top:0}
  .divider{height:1px;background:var(--border);margin:16px 0}

  /* 按钮：主按钮用墨，而不是蓝 */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    height:34px;padding:0 14px;border-radius:var(--r-md);border:1px solid transparent;
    background:var(--btn);color:var(--btn-fg);font-size:13px;font-weight:500;
    cursor:pointer;white-space:nowrap;
    transition:opacity var(--t-fast) var(--ease),background var(--t-fast) var(--ease),
      border-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
  .btn:hover{opacity:.88}
  .btn:active{transform:scale(.985)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:var(--r-sm)}
  .btn.outline{background:transparent;border-color:var(--border);color:var(--fg-2)}
  .btn.outline:hover{background:var(--secondary);color:var(--foreground);opacity:1}
  .btn.ghost{background:transparent;color:var(--muted-foreground)}
  .btn.ghost:hover{background:var(--secondary);color:var(--foreground);opacity:1}
  .btn.danger{background:transparent;border-color:var(--border);color:var(--destructive)}
  .btn.danger:hover{background:var(--danger-soft);opacity:1}
  .btn.ghost.danger-text{color:var(--muted-foreground)}
  .btn.ghost.danger-text:hover{background:var(--danger-soft);color:var(--destructive)}

  input,textarea,select{
    width:100%;height:36px;padding:0 11px;border:1px solid var(--input);
    border-radius:var(--r-md);background:var(--card);color:var(--foreground);
    font-size:13.5px;font-family:inherit;outline:none;
    transition:border-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
  textarea{height:auto;padding:10px 11px;resize:vertical;min-height:84px;line-height:1.6}
  input:focus,textarea:focus,select:focus{
    border-color:color-mix(in srgb,var(--ring) 62%,var(--input));
    box-shadow:0 0 0 2px color-mix(in srgb,var(--ring) 12%,transparent)}
  input::placeholder,textarea::placeholder{color:var(--muted-foreground)}
  label.lbl{display:block;font-size:12.5px;color:var(--muted-foreground);margin-bottom:6px}

  /* 徽章：中性为主，语义色只在真需要时 */
  .badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;
    border-radius:var(--r-xs);font-size:11.5px;font-weight:400;
    background:var(--secondary);color:var(--fg-2)}
  .badge.blue{background:var(--info-soft);color:var(--info)}
  .badge.ok{background:var(--success-soft);color:var(--success)}
  .badge.warn{background:var(--warning-soft);color:var(--warning)}
  .badge.bad{background:var(--danger-soft);color:var(--destructive)}

  /* 分段控件 / 标签页 */
  .seg,.tabs{display:inline-flex;background:var(--secondary);border:1px solid var(--border);
    border-radius:var(--r-md);padding:2px;gap:2px}
  .seg button,.tabs button{border:0;background:transparent;color:var(--fg-2);
    font:inherit;font-size:12.5px;padding:5px 12px;border-radius:var(--r-sm);cursor:pointer;
    transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
  .seg button:hover,.tabs button:hover{color:var(--foreground)}
  .seg button.on,.tabs button.on{background:var(--card);color:var(--foreground);font-weight:500;
    box-shadow:0 1px 2px rgba(31,27,22,.06);
    transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease),
      transform var(--dur-quick) var(--ease)}
  .seg button.on:active,.tabs button.on:active{transform:scale(.96)}

  /* ---------- 表格 ---------- */
  table.tb{width:100%;border-collapse:collapse}
  table.tb th{text-align:left;font-size:11.5px;font-weight:400;color:var(--muted-foreground);
    padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
  table.tb td{padding:12px 10px;border-bottom:1px solid var(--border);
    font-size:13.5px;vertical-align:middle;color:var(--fg-2)}
  table.tb td:first-child{color:var(--foreground);font-weight:500}
  table.tb tr:last-child td{border-bottom:none}
  table.tb tbody tr{transition:background var(--t-fast) var(--ease)}
  table.tb tbody tr:hover{background:var(--accent)}

  /* ---------- 空状态 ---------- */
  .empty{padding:32px 16px;text-align:center;color:var(--muted-foreground);font-size:13px}
  .es{display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:44px 24px;text-align:center}
  .es .es-ic{width:40px;height:40px;display:flex;align-items:center;justify-content:center;
    border-radius:var(--r-lg);background:var(--secondary);color:var(--muted-foreground);
    margin-bottom:14px}
  .es .es-t{font-size:14px;font-weight:500;color:var(--foreground);margin-bottom:4px}
  .es .es-d{font-size:12.5px;color:var(--muted-foreground);line-height:1.7;max-width:340px}
  .es .es-a{margin-top:16px}

  /* ---------- 拖放区 ---------- */
  .drop{border:1px dashed var(--input);border-radius:var(--r-lg);padding:24px;text-align:center;
    color:var(--muted-foreground);cursor:pointer;
    transition:border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
  .drop:hover{border-color:var(--primary);background:var(--accent);color:var(--fg-2)}

  /* ===== v3 指挥台布局（对标 Linear/Vercel：一屏一个 hero + 指标带 + 队列） ===== */
  .v3-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
  .v3-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px}
  .v3-c4{grid-column:span 4}.v3-c5{grid-column:span 5}.v3-c6{grid-column:span 6}
  .v3-c7{grid-column:span 7}.v3-c8{grid-column:span 8}.v3-c12{grid-column:span 12}
  @media(max-width:900px){.v3-c4,.v3-c5,.v3-c6,.v3-c7,.v3-c8{grid-column:span 12}}
  .v3-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
  .v3-hd h1{font-size:20px;font-weight:500;letter-spacing:-.2px;margin:0}
  .v3-hd .sub{font-size:12.5px;color:var(--muted-foreground);margin-top:3px}
  .v3-hero .lab{font-size:12px;color:var(--muted-foreground)}
  .v3-hero .big{font-size:44px;font-weight:500;letter-spacing:-1.4px;line-height:1.05;margin:8px 0 6px;
    animation:numPop var(--dur-medium) var(--ease) both}
  @keyframes numPop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
  .v3-hero .big small{font-size:14px;font-weight:400;color:var(--muted-foreground);letter-spacing:0;margin-left:6px}
  .v3-hero .delta{font-size:12.5px;color:var(--muted-foreground)}
  .v3-hero .delta b{font-weight:500;color:var(--success)}
  .v3-acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .v3-sh{font-size:13px;font-weight:500;color:var(--fg-2);margin-bottom:12px;
    display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .v3-sh .meta{font-size:11.5px;color:var(--muted-foreground);font-family:var(--mono);font-weight:400}
  .v3-strip{display:flex;align-items:stretch;padding:18px 24px}
  .v3-strip .m{flex:1;min-width:0;padding:0 20px}
  .v3-strip .m:first-child{padding-left:0}.v3-strip .m:last-child{padding-right:0}
  .v3-strip .m+.m{border-left:1px solid var(--border)}
  .v3-strip .k{font-size:11.5px;color:var(--muted-foreground)}
  .v3-strip .v{font-size:22px;font-weight:500;letter-spacing:-.5px;line-height:1.25;margin-top:2px}
  .v3-strip .v small{font-size:12px;color:var(--muted-foreground);font-weight:400;letter-spacing:0;margin-left:3px}
  .v3-strip .d{font-size:11.5px;color:var(--muted-foreground);margin-top:2px}
  .v3-strip .d b{font-weight:500}
  @media(max-width:640px){.v3-strip{flex-wrap:wrap;gap:12px}.v3-strip .m{flex:1 1 40%}.v3-strip .m+.m{border-left:0}}
  .v3-qrow{position:relative;display:flex;align-items:center;gap:12px;
    padding:10px;margin:0 -10px;border-radius:6px;overflow:hidden}
  .v3-qfill{position:absolute;left:0;top:0;bottom:0;z-index:0;border-radius:6px;
    background:color-mix(in srgb,var(--primary) 10%,transparent)}
  .v3-qrow>*:not(.v3-qfill){position:relative;z-index:1}
  .v3-qname{flex:1;min-width:0}
  .v3-qname .n{font-size:13.5px;font-weight:500}
  .v3-qname .m{font-size:11.5px;color:var(--muted-foreground);margin-top:2px}
  .v3-qbar{width:76px;height:4px;border-radius:99px;background:var(--secondary);overflow:hidden;flex:0 0 76px}
  .v3-qbar i{display:block;height:100%;background:var(--primary);border-radius:99px}
  .v3-qnum{font-size:13px;font-family:var(--mono);color:var(--fg-2);width:30px;text-align:right}
  .v3-resume{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
  .v3-resume:last-child{border-bottom:0;padding-bottom:0}
  .v3-resume:first-child{padding-top:0}
  .v3-rt{flex:1;min-width:0}
  .v3-rt .a{font-size:13px;font-weight:500}
  .v3-rt .b{font-size:11.5px;color:var(--muted-foreground);margin-top:2px}
  .v3-chart{margin-top:20px;padding-top:18px;border-top:1px solid var(--border)}
  .v3-chart .t{font-size:12px;color:var(--muted-foreground);margin-bottom:8px}
  .v3-axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted-foreground);
    font-family:var(--mono);margin-top:6px}
  .v3-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}

  /* ===== 仪表盘 ===== */
  .genbar{display:flex;gap:8px;align-items:center}
  .dash-title{font-size:20px;font-weight:500;letter-spacing:-.3px;line-height:1.3}
  .dash-sub{color:var(--muted-foreground);font-size:12.5px;margin-top:4px}
  .dashgrid{display:flex;flex-direction:column;gap:16px;margin-top:20px}
  .drow{display:flex;gap:16px;align-items:stretch}
  .drow .dcard{min-width:0}
  @media(max-width:760px){.drow{flex-direction:column}.drow .dcard{flex:1 1 auto!important}}

  .dcard{background:transparent;border:0;padding:0;perspective:1400px;cursor:grab;
    min-width:0;display:flex;flex-direction:column}
  .drow > .dcard{align-self:stretch}
  .dflip{position:relative;transform-style:preserve-3d;
    transition:transform var(--t-slow) var(--ease);
    flex:1 1 auto;min-height:140px;will-change:transform}
  .dcard.flipped .dflip{transform:rotateY(180deg)}
  .dfront,.dback{backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);
    padding:20px;height:100%;display:flex;flex-direction:column;
    transition:border-color var(--t-mid) var(--ease),box-shadow var(--t-mid) var(--ease)}
  .dfront{position:relative;overflow:hidden}
  .dcard:hover .dfront{border-color:color-mix(in srgb,var(--foreground) 18%,var(--border));
    box-shadow:0 2px 8px rgba(31,27,22,.05)}
  .dfront .dt{flex:0 0 auto;font-size:12px;color:var(--muted-foreground);margin-bottom:12px;
    display:flex;justify-content:space-between;gap:8px;letter-spacing:0}
  .dfront .dbody{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0}
  .dcard .dv{font-size:30px;font-weight:500;letter-spacing:-1px;line-height:1.1}
  .dcard .dv small{font-size:12.5px;font-weight:400;color:var(--muted-foreground);
    margin-left:5px;letter-spacing:0}
  .dcard .dh{font-size:12px;color:var(--muted-foreground);margin-top:8px;line-height:1.6}
  .dlist{margin:0;padding-left:16px;font-size:13px;line-height:1.95;color:var(--fg-2)}
  .dlist li::marker{color:var(--muted-foreground)}
  .dcard.flipped{cursor:default;z-index:6;flex-grow:2.2!important;
    transition:flex-grow var(--t-slow) var(--ease)}
  .dcard.flipped .dflip{min-height:320px}
  @media(max-width:900px){.dcard.flipped{flex-grow:1!important}}

  /* 背面表单 */
  .dback{position:absolute;inset:0;transform:rotateY(180deg);overflow:auto;cursor:default;
    border-color:color-mix(in srgb,var(--primary) 34%,var(--border));padding:16px}
  .dback .dlabel{font-size:11px;color:var(--muted-foreground);margin-bottom:4px;letter-spacing:0}
  .dback input.mini,.dback textarea.mini{width:100%;font:inherit;font-size:12.5px;
    background:var(--secondary);border:1px solid var(--border);border-radius:var(--r-sm);
    padding:5px 8px;color:var(--foreground);margin-bottom:6px}
  .dback textarea.mini{resize:vertical;min-height:54px}
  .dback .dv input{font:inherit;font-size:22px;font-weight:500;width:100%;
    background:var(--secondary);border:1px solid var(--border);border-radius:var(--r-md);
    padding:3px 9px;color:var(--foreground)}
  .drows{display:flex;flex-direction:column;gap:4px;max-height:150px;overflow:auto}
  .drow-edit{display:flex;gap:4px;align-items:center}
  .drow-edit input.mini{margin:0;flex:1;min-width:0;padding:4px 6px;font-size:11.5px}
  .drow-edit input.dnum{flex:0 0 56px;text-align:right}
  .drow-edit .ddel{flex:0 0 auto;padding:0 6px;height:24px;font-size:12px;line-height:1}
  .dback .dadd{align-self:flex-start;height:24px;padding:0 8px;font-size:11.5px;margin-top:2px}

  /* 缩放手柄：hover 右下角才出现 */
  .dcard .rz{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;
    opacity:0;transition:opacity var(--t-mid) var(--ease);z-index:3;
    background:
      linear-gradient(135deg,transparent 52%,var(--muted-foreground) 52%,var(--muted-foreground) 58%,transparent 58%),
      linear-gradient(135deg,transparent 70%,var(--muted-foreground) 70%,var(--muted-foreground) 76%,transparent 76%);
    border-bottom-right-radius:var(--r-lg)}
  .dcard:hover .rz{opacity:.5}
  .dcard .rz:hover{opacity:1}
  .dcard.resizing{cursor:nwse-resize;user-select:none}
  .dcard.resizing .dflip{transition:none}

  /* 图表：一条主图，一个强调色 */
  .bars{display:flex;align-items:flex-end;gap:6px;height:92px;margin-top:8px}
  .bars .b{flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-end;gap:6px;height:100%}
  .bars .b i{width:100%;max-width:32px;background:var(--secondary);border-radius:3px 3px 2px 2px;
    min-height:3px;transition:height var(--t-slow) var(--ease)}
  .bars .b.peak i{background:var(--primary)}
  .bars .b.zero i{background:var(--border);min-height:2px;border-radius:1px}
  .bars .b.zero span{opacity:.55}
  .bars .b span{font-size:10.5px;color:var(--muted-foreground);
    font-family:var(--mono);white-space:nowrap}
  .prog{height:6px;background:var(--secondary);border-radius:99px;overflow:hidden;margin-top:14px}
  .prog i{display:block;height:100%;background:var(--primary);border-radius:99px;
    transition:width var(--t-slow) var(--ease)}

  /* 签名细节：荧光笔痕，只标那个数字 */
  .hl{background-image:linear-gradient(180deg,transparent 56%,
    color-mix(in srgb,var(--mark) 85%,transparent) 56%,
    color-mix(in srgb,var(--mark) 85%,transparent) 92%,transparent 92%);
    padding:0 2px;border-radius:2px}

  /* ===== 笔记四栏 ===== */
  .notebar{display:grid;
    grid-template-columns:var(--nb1,228px) var(--nb2,248px) minmax(340px,1fr) var(--nb3,300px);
    gap:16px;height:calc(100vh - 158px);min-height:520px;align-items:stretch}
  .notebar > *{min-width:0}
  @media(max-width:1360px){.notebar{grid-template-columns:208px 232px minmax(320px,1fr)}
    .notebar .ai-panel{display:none}}
  @media(max-width:980px){.notebar{grid-template-columns:1fr;height:auto}
    .notebar .folder-pane,.notebar .list-pane{max-height:280px}}
  .pane{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);
    display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .pane-head{padding:10px 12px;border-bottom:1px solid var(--border);
    font-size:12px;font-weight:500;color:var(--muted-foreground);
    display:flex;align-items:center;justify-content:space-between;
    background:transparent;flex:0 0 auto;letter-spacing:0}
  .pane-body{overflow:auto;flex:1;min-height:0;padding:8px}
  .pane[data-col]{position:relative}
  .pane[data-col]::after{content:"";position:absolute;right:-9px;top:8px;bottom:8px;width:10px;
    cursor:col-resize;z-index:6;border-radius:4px;transition:background var(--t-fast) var(--ease)}
  .pane[data-col]:hover::after{background:color-mix(in srgb,var(--primary) 26%,transparent)}
  body.col-resizing{cursor:col-resize!important;user-select:none}
  body.col-resizing *{cursor:col-resize!important}

  .ftree{list-style:none;margin:0;padding:0;font-size:13px}
  .ftree li{margin:1px 0}
  .fnode{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;
    border-radius:var(--r-sm);cursor:pointer;transition:background var(--t-fast) var(--ease);
    white-space:nowrap;overflow:hidden}
  .fnode:hover{background:var(--secondary)}
  .fnode.on{background:var(--accent);font-weight:500}
  .fnode .caret{width:12px;flex:0 0 12px;color:var(--muted-foreground);font-size:9px;
    transition:transform var(--t-fast) var(--ease)}
  .fnode .caret.open{transform:rotate(90deg)}
  .fnode .fname{overflow:hidden;text-overflow:ellipsis;flex:1}
  .fnode .cnt{font-size:11px;color:var(--muted-foreground);flex:0 0 auto;
    font-family:var(--mono)}
  .nitem{padding:10px;border-radius:var(--r-md);cursor:pointer;
    transition:background var(--t-fast) var(--ease)}
  .nitem:hover{background:var(--secondary)}
  .nitem.on{background:var(--accent)}
  .nitem .nt{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nitem .ns{font-size:11.5px;color:var(--muted-foreground);margin-top:3px;line-height:1.6;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .editor{display:flex;flex-direction:column;min-height:0;height:100%}
  .editor-head{padding:10px 14px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .editor-head input{font-size:14.5px;font-weight:500;border:0;background:transparent;flex:1;
    color:var(--foreground);outline:none;height:auto;padding:0}
  .editor-head input:focus{box-shadow:none}
  .editor-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .editor-body textarea{flex:1;width:100%;border:0;resize:none;outline:none;padding:20px 24px;
    font-family:var(--mono);font-size:13px;line-height:1.9;background:transparent;
    color:var(--foreground);min-height:280px}
  .editor-body textarea:focus{box-shadow:none}
  .mdview{padding:20px 24px;font-size:14px;line-height:1.9;overflow:auto;min-height:0}
  .mdview h1,.mdview h2,.mdview h3{margin:18px 0 8px;letter-spacing:0;font-weight:500}
  .mdview h1{font-size:20px}.mdview h2{font-size:17px}.mdview h3{font-size:15px}
  .mdview p{margin:8px 0}
  .mdview ul,.mdview ol{padding-left:20px;margin:8px 0}
  .mdview li{margin:4px 0}
  .mdview code{background:var(--secondary);padding:1px 5px;border-radius:var(--r-xs);font-size:12.5px}
  .mdview pre{background:var(--secondary);padding:12px;border-radius:var(--r-md);overflow:auto}
  .mdview blockquote{border-left:2px solid var(--border);margin:12px 0;padding:2px 14px;
    color:var(--muted-foreground)}
  .ai-panel{display:flex;flex-direction:column;min-height:0}
  .ai-thread{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
  .ai-msg{font-size:12.5px;line-height:1.75;padding:10px 12px;border-radius:var(--r-md);
    background:var(--secondary);white-space:pre-wrap;word-break:break-word;color:var(--fg-2)}
  .ai-msg.me{background:var(--accent);color:var(--foreground)}
  .ai-msg .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .ai-input{padding:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
  .ai-input .btn:disabled{background:transparent;color:var(--muted-foreground);
    border:1px solid var(--border);opacity:1}
  .ai-input textarea{width:100%;font:inherit;font-size:12.5px;background:var(--card);
    border:1px solid var(--input);border-radius:var(--r-md);padding:8px;resize:vertical;
    min-height:56px;color:var(--foreground)}

  /* ===== 学习页三栏 ===== */
  .studybar{display:grid;
    grid-template-columns:var(--st1,264px) minmax(0,1fr) var(--st2,304px);
    gap:16px;align-items:stretch;min-height:520px}
  @media(max-width:1300px){.studybar{grid-template-columns:240px minmax(0,1fr)}
    .studybar .side-right{grid-column:1/-1}}
  @media(max-width:900px){.studybar{grid-template-columns:1fr}}
  .side-left,.side-right{background:var(--card);border:1px solid var(--border);
    border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;min-height:0}
  .chapter-row{display:flex;align-items:center;gap:8px;min-height:36px;padding:6px 8px;
    border-radius:var(--r-sm);cursor:pointer;font-size:13px;
    transition:background var(--t-fast) var(--ease)}
  .chapter-row:hover{background:var(--secondary)}
  .chapter-row.on{background:var(--accent);font-weight:500}
  .chapter-row .cbar{height:3px;border-radius:99px;background:var(--secondary);
    overflow:hidden;flex:0 0 40px}
  .chapter-row .cbar i{display:block;height:100%;background:var(--primary)}

  .flipcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);
    padding:28px;min-height:240px;display:flex;flex-direction:column;justify-content:center;
    cursor:pointer;position:relative;
    transition:border-color var(--t-mid) var(--ease),box-shadow var(--t-mid) var(--ease)}
  .flipcard:hover{border-color:color-mix(in srgb,var(--foreground) 20%,var(--border));
    box-shadow:0 2px 10px rgba(31,27,22,.05)}
  .flipcard .fc-q{font-size:16px;font-weight:500;line-height:1.75}
  .flipcard .fc-a{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);
    font-size:14px;line-height:1.85;color:var(--fg-2)}
  .flipcard .fc-hint{position:absolute;right:16px;bottom:12px;font-size:11px;
    color:var(--muted-foreground)}
  .stat-row{display:flex;flex-wrap:wrap;border-top:1px solid var(--border);
    border-bottom:1px solid var(--border)}
  .stat-row + .stat-row{border-top:0}
  .stat-box{flex:1 1 88px;background:transparent;border:0;border-radius:0;
    padding:12px 12px 12px 0}
  .stat-box + .stat-box{border-left:1px solid var(--border);padding-left:12px}
  .stat-box .k{font-size:11px;color:var(--muted-foreground)}
  .stat-box .v{font-size:22px;font-weight:500;margin-top:2px;letter-spacing:-.5px}

  /* ===== 视频页 ===== */
  .vlayout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
    gap:16px;margin-top:20px;align-items:start}
  @media(max-width:1100px){.vlayout{grid-template-columns:1fr}}
  .vleft{display:flex;flex-direction:column;gap:12px;min-width:0}
  .vplayer{background:#111013;border:1px solid var(--border);border-radius:var(--r-lg);
    overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
  .vplayer video{width:100%;height:100%;object-fit:contain;background:#0b0a0c}
  .vplayer .ph{color:#8f8a80;font-size:12.5px;text-align:center;padding:20px;line-height:1.8}
  .vup{display:flex;gap:12px;align-items:center;margin-top:4px;flex-wrap:wrap}
  .vup-box{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:4px;padding:20px 16px;border:1px dashed var(--input);
    border-radius:var(--r-lg);cursor:pointer;text-align:center;
    transition:border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
  .vup-box:hover{border-color:var(--primary);background:var(--accent)}
  .vup-ic{color:var(--muted-foreground);display:flex;margin-bottom:4px}
  .vup-t{font-size:13.5px;color:var(--foreground);font-weight:500}
  .vup-d{font-size:11.5px;color:var(--muted-foreground);font-family:var(--mono)}
  .vup-or{align-self:center;font-size:11.5px;color:var(--muted-foreground)}
  .vup-link{flex:1 1 320px;min-width:0;display:flex;align-items:center;gap:8px}
  .vup-link input{flex:1;min-width:0}
  @media(max-width:700px){.vup-or{display:none}.vup-link{flex:1 1 100%;flex-wrap:wrap}
    .vup-link .btn{flex:1 1 100%}}
  .vframes{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px}
  .vframes .fh{font-size:11.5px;color:var(--muted-foreground);margin-bottom:8px;
    display:flex;justify-content:space-between}
  .fstrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .fthumb{flex:0 0 132px;border-radius:var(--r-sm);overflow:hidden;
    border:1px solid var(--border);cursor:pointer;position:relative;background:var(--secondary);
    transition:border-color var(--t-fast) var(--ease)}
  .fthumb:hover{border-color:var(--primary)}
  .fthumb img{width:100%;height:74px;object-fit:cover;display:block}
  .fthumb .fts{position:absolute;left:5px;bottom:5px;background:rgba(0,0,0,.66);color:#f4f2ec;
    font-size:10px;padding:1px 5px;border-radius:var(--r-xs);font-family:var(--mono)}
  .fthumb .fdoc{position:absolute;right:4px;top:4px;background:var(--foreground);
    color:var(--background);font-size:9.5px;padding:1px 4px;border-radius:var(--r-xs)}
  .vidbar{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);
    overflow:hidden}
  .vidbar .vhead{padding:10px 12px;font-size:11.5px;color:var(--muted-foreground);
    border-bottom:1px solid var(--border);font-weight:400}
  .vtl{max-height:260px;overflow:auto;padding:6px}
  .vseg{display:flex;gap:10px;padding:8px;border-radius:var(--r-sm);cursor:pointer;
    transition:background var(--t-fast) var(--ease)}
  .vseg:hover{background:var(--secondary)}
  .vseg.on{background:var(--accent)}
  .vseg .vt{font-size:11px;color:var(--primary);font-family:var(--mono);
    flex:0 0 40px;padding-top:2px}
  .vseg .vx{font-size:12.5px;line-height:1.65;color:var(--fg-2)}
  .vidmain{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);
    padding:24px}
  .vsec + .vsec{margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
  .vst{font-size:11.5px;color:var(--muted-foreground);font-weight:400;letter-spacing:0;
    margin-bottom:8px}
  .vstext{font-size:14px;line-height:1.9;color:var(--fg-2)}
  .vpoints{margin:0;padding-left:18px;font-size:13.5px;line-height:2}
  .vpoints li::marker{color:var(--muted-foreground)}

  /* 大纲树：像文件目录 */
  .vtree{background:transparent;padding:0;max-height:560px;overflow:auto}
  .vtree ul{list-style:none;margin:0;padding:0}
  .vtree li{position:relative}
  .vtree .tn{padding:5px 0;font-size:13px;line-height:1.65;position:relative;display:flex;gap:6px}
  .vtree .tn::before{content:'';position:absolute;left:-12px;top:0;bottom:0;border-left:1px solid var(--border)}
  .vtree .tn::after{content:'';position:absolute;left:-12px;top:14px;width:8px;border-top:1px solid var(--border)}
  .vtree > ul > li > .tn::before,.vtree > ul > li > .tn::after{display:none}
  .vtree .lv1 .tn{font-weight:500;font-size:14px;margin-top:10px}
  .vtree .lv2 .tn{font-weight:400;color:var(--fg-2)}
  .vtree .lv3 .tn{color:var(--muted-foreground)}
  .vtree .bullet{color:var(--muted-foreground);flex:0 0 auto;font-size:9px;padding-top:6px}
  .vtree .fold{cursor:pointer;user-select:none}
  .vtree .fold .caret{transition:transform var(--t-fast) var(--ease);display:inline-block;
    font-size:9px;color:var(--muted-foreground)}
  .vtree .fold.closed .caret{transform:rotate(-90deg)}
  .vtree .fold.closed + ul{display:none}

  /* ===== 问答 ===== */
  .qa-wrap{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:420px;gap:16px}
  .qa-wrap .chat{flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:8px;
    scroll-behavior:smooth;overscroll-behavior:contain}
  .qa-wrap .composer{flex:0 0 auto}
  .chat.chat-empty{justify-content:center;align-items:stretch}
  .chat{display:flex;flex-direction:column;gap:16px}
  .chat .msg{flex:0 0 auto}
  .msg{display:flex;gap:10px;align-items:flex-start}
  .msg .who{width:26px;height:26px;border-radius:50%;flex:0 0 26px;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500}
  .msg.user .who{background:var(--secondary);color:var(--fg-2)}
  .msg.bot .who{background:var(--foreground);color:var(--background)}
  .msg .bubble{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);
    padding:14px 16px;max-width:760px;line-height:1.75;color:var(--fg-2);
    overflow-wrap:anywhere}
  .msg.user .bubble{background:var(--accent);border-color:transparent;color:var(--foreground);
    white-space:pre-wrap}
  .bubble .katex{font-size:1.02em}
  .bubble .katex-display{margin:10px 0;overflow-x:auto;overflow-y:hidden}
  .bubble h1,.bubble h2,.bubble h3{font-size:15px;font-weight:500;margin:14px 0 6px;
    color:var(--foreground)}
  .bubble ul,.bubble ol{padding-left:20px;margin:8px 0}
  .bubble li{margin:4px 0}
  .bubble p{margin:8px 0}
  .src{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .src .s{font-size:11px;padding:2px 7px;border-radius:var(--r-xs);
    background:var(--secondary);color:var(--muted-foreground);font-family:var(--mono)}
  .src a.s{text-decoration:none;transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
  .src a.s:hover{background:var(--info-soft);color:var(--info)}

  /* ---- AI 过程可视化（Beautiful UI：把黑盒变白盒，克制版） ---- */
  .aiproc{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px;
    font-size:11.5px;color:var(--muted-foreground)}
  .aiproc .step{display:inline-flex;align-items:center;gap:5px;
    padding:2px 8px;border-radius:99px;border:1px solid var(--border);
    background:var(--card);color:var(--muted-foreground);
    transition:color var(--dur-quick) var(--ease),background var(--dur-quick) var(--ease),
      border-color var(--dur-quick) var(--ease)}
  .aiproc .step .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.5}
  .aiproc .step.done{color:var(--success);border-color:transparent;background:var(--success-soft)}
  .aiproc .step.done .dot{opacity:1}
  .aiproc .step.active{color:var(--info);border-color:var(--info);background:var(--info-soft)}
  .aiproc .step.active .dot{opacity:1;animation:aippulse 1.2s var(--ease) infinite}
  @keyframes aippulse{0%,100%{opacity:.35}50%{opacity:1}}
  .aiproc .elapsed{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted-foreground)}
  /* 思考轨迹：可展开，安静的左竖线 */
  .think{margin:0 0 10px;border-left:2px solid var(--border);padding:2px 0 2px 12px}
  .think>summary{cursor:pointer;list-style:none;font-size:11.5px;color:var(--muted-foreground);
    display:flex;align-items:center;gap:6px;user-select:none}

const S = { user:null, tab:'dash', stats:null, docs:[], due:[], qbank:[], plan:null,

/* ---------- utils ---------- */
function fitAll(){ /* 布局变动后无需重算，占位以兼容调用 */ }
function restoreCols(){
  ['nb1','nb2','nb3','st1','st2'].forEach(k=>{
    try{ const v=localStorage.getItem('gflc_'+k); if(v) document.documentElement.style.setProperty('--'+k,v); }catch(e){}
  });
}
function enableColResize(){
  document.querySelectorAll('[data-col]').forEach(el=>{
    const h=(e)=>{
      const r=el.getBoundingClientRect();
      if(e.clientX < r.right-12 || e.clientX > r.right+6) return;
      e.preventDefault(); e.stopPropagation();
      document.body.classList.add('col-resizing');
      const key=el.dataset.col, startX=e.clientX, startW=r.width;
      const mv=(ev)=>{
        const w=Math.max(150,Math.min(520,startW+(ev.clientX-startX)));
        document.documentElement.style.setProperty('--'+key,w+'px');
      };
      const up=()=>{
        window.removeEventListener('mousemove',mv); window.removeEventListener('mouseup',up);
        document.body.classList.remove('col-resizing');
        try{ localStorage.setItem('gflc_'+key, getComputedStyle(document.documentElement)
              .getPropertyValue('--'+key)||(Math.round(startW)+'px')); }catch(e){}
      };
      window.addEventListener('mousemove',mv); window.addEventListener('mouseup',up);
    };
    el.addEventListener('mousedown',h);
  });
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove('show'),2000);}
async function api(path, opts={}){
  const fd = opts.body instanceof FormData;
  const res = await fetch('/api'+path,{credentials:'include',...opts,
    headers:fd?{...(opts.headers||{})}:{'Content-Type':'application/json',...(opts.headers||{})}});
  let d=null;try{d=await res.json();}catch(e){}
  if(!res.ok||(d&&d.ok===false)) throw new Error((d&&d.error&&d.error.message)||('请求失败 '+res.status));
  return d?d.data:null;
}
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isDark=()=>document.documentElement.classList.contains('dark');

/* LaTeX 渲染（KaTeX 本地托管）：等脚本就绪后渲染，失败保留源码 */
function typeset(el){
  if(!el) return;
  const run=()=>{
    if(!window.renderMathInElement) return false;
    try{
      renderMathInElement(el,{
        delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},
                    {left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],
        throwOnError:false, errorColor:'#c0392b',
        ignoredTags:['script','noscript','style','textarea','pre','code']
      });
      el.querySelectorAll('.katex-error').forEach(n=>{ n.style.color='var(--destructive)'; });
      return true;
    }catch(e){ return false; }
  };
  if(run()) return;
  let n=0;
  const t=setInterval(()=>{ if(run()||++n>20) clearInterval(t); },150);
}

/* ---------- 后台任务 ---------- */
const TASKS={};   // id -> {label,progress,status,error}
const TYPE_CN={pdf_parse:'解析 PDF',card_generate:'生成卡片',question_import:'导入题库',
  plan_generate:'生成计划',video_upload:'视频转写',video_url:'链接视频',dashboard_generate:'生成仪表盘'};
const STATUS_CN={pending:'排队中',running:'进行中',ready:'已完成',failed:'失败'};
/* 错误信息脱敏：去掉本机绝对路径，只留人能读的部分 */
function shortErr(m){
  if(!m) return '';
  let t=String(m).replace(/[A-Za-z]:\\[^\s;，、]*/g,'（本地临时文件）')
                 .replace(/\s+/g,' ').trim();
  return t.length>70 ? t.slice(0,70)+'…' : t;
}
function renderDock(){
  let dock=document.getElementById('taskdock');
  if(!dock){ dock=document.createElement('div'); dock.id='taskdock'; dock.className='taskdock'; document.body.appendChild(dock); }
  const items=Object.entries(TASKS);
  dock.innerHTML=items.map(([id,t])=>`
    <div class="tk">
      <div class="tt"><span>${esc(t.label)}</span><span>${t.progress}%</span></div>
      <div class="tp"><i style="width:${t.progress}%"></i></div>
      <div class="ts">${t.status==='failed'?('失败：'+esc(t.error||'')):(t.status==='ready'?'完成':(t.status==='pending'?'排队中…':'处理中…'))}</div>
    </div>`).join('');
}
async function runTask(path, opts, label){
  const d=await api(path,opts);
  if(!d||!d.task_id){ return d; }
  const tid=d.task_id;
  TASKS[tid]={label,progress:0,status:'running'}; renderDock();
  for(let i=0;i<900;i++){
    await new Promise(r=>setTimeout(r,700));
    let t; try{ t=await api('/tasks/'+tid); }catch(e){ delete TASKS[tid]; renderDock(); throw e; }
    TASKS[tid].progress=t.progress||0; TASKS[tid].status=t.status;
    if(t.status==='failed'){
      TASKS[tid].error=t.error_message; renderDock();
      setTimeout(()=>{delete TASKS[tid];renderDock();},5000);
      throw new Error(t.error_message||'任务失败');
    }
    renderDock();
    if(t.status==='ready'){ setTimeout(()=>{delete TASKS[tid];renderDock();},1400); return t.result||{}; }
  }
  delete TASKS[tid]; renderDock(); throw new Error('任务超时');
}

function setTitle(){const t=TITLES[S.tab];document.getElementById('title').textContent=t[0];document.getElementById('subtitle').textContent=t[1];}

async function refresh(){
  try{ S.stats=await api('/dashboard/stats'); }catch(e){}
  if(S.tab==='dash'){
    try{ S.dash=await api('/dashboard/latest'); }catch(e){ S.dash=null; }
    try{ S.docs=await api('/documents'); }catch(e){ S.docs=[]; }
  }
  if(S.tab==='docs'){ try{ S.docs=await api('/documents'); }catch(e){ S.docs=[]; }
    try{ S.notes=await api('/notes'); }catch(e){ S.notes=[]; } }
  if(S.tab==='deck'){ try{ S.decks=await api('/decks'); }catch(e){ S.decks=[]; } }
  if(S.tab==='notes'){
    try{ S.folders=await api('/notes/folders'); }catch(e){ S.folders=[]; }
    try{
      const qs='?page='+(S.notesPage||1)+'&page_size=12'+(S.folderId?('&folder_id='+S.folderId):'');
      const r=await api('/notes'+qs);
      if(r && r.items){ S.notes=r.items; S.notesTotal=r.total||0; S.notesPages=r.pages||1; }
      else { S.notes=r||[]; S.notesTotal=(r||[]).length; S.notesPages=1; }
    }catch(e){ S.notes=[]; S.notesTotal=0; S.notesPages=1; }
  }
  if(S.tab==='review'){ try{ S.due=(await api('/review/due?limit=50')).cards; }catch(e){ S.due=[]; } }
  if(S.tab==='video'){ if(!(S.vList&&S.vList.length)) await loadVideos(); }
  if(S.tab==='study'){
    try{ S.qOverview=await api('/quiz/overview'); }catch(e){ S.qOverview=null; }
    try{ S.rec=await api('/quiz/recommend'); }catch(e){ S.rec=null; }
    try{ S.qChapters=await api('/quiz/chapters'); }catch(e){ S.qChapters=[]; }
    try{ S.qbank=await api('/questions'); }catch(e){ S.qbank=[]; }
    try{ S.banks=await api('/questions/banks'); }catch(e){ S.banks=[]; }
    try{ S.decks=await api('/decks'); }catch(e){ S.decks=[]; }
  }
  render();
}

/* ---------- render router ---------- */
function render(){
  const v=document.getElementById('view'); if(!v) return;
  if(S.tab==='dash') return pageDash(v);
  if(S.tab==='notes') return pageNotes(v);
  if(S.tab==='docs') return pageDocs(v);
  if(S.tab==='deck') return pageDecks(v);
  if(S.tab==='study') return pageStudy(v);
  if(S.tab==='review') return pageReview(v);
  if(S.tab==='qa') return pageQa(v);

async function pageTasks(v){
  let ts=[];
  try{ ts=await api('/tasks?limit=30'); }catch(e){}
  v.innerHTML=`<div class="row between" style="margin-bottom:12px">
      <span class="muted" style="font-size:12.5px">最近 30 条后台任务 · 卡住会被看门狗判失败，可一键重试</span>
      <div class="row" style="gap:8px">
        <button class="btn ghost sm" id="tclean">清理旧失败</button>
        <button class="btn outline sm" id="treload">刷新</button></div></div>
    <div class="card" style="padding:4px 16px">${ts.length?`<table class="tb">
      <thead><tr><th style="width:112px">类型</th><th style="width:88px">状态</th><th style="width:150px">进度</th><th>结果 / 错误</th><th style="width:88px"></th></tr></thead>
      <tbody>${ts.map(t=>`<tr>
        <td style="white-space:nowrap">${esc(TYPE_CN[t.type]||t.type)}</td>
        <td><span class="badge ${t.status==='ready'?'ok':(t.status==='failed'?'bad':'')}">${STATUS_CN[t.status]||t.status}</span></td>
        <td>${t.status==='failed'
            ? '<span class="muted" style="font-size:11.5px">未完成</span>'
            : `<div class="prog" style="margin:0"><i style="width:${t.progress||0}%"></i></div>`}
          ${t.elapsed?`<span class="muted" style="font-size:10.5px;font-family:var(--mono)">${Math.round(t.elapsed)}s</span>`:''}</td>
        <td class="muted" style="font-size:12.5px">${esc(shortErr(t.error_message)||summarize(t.result))}</td>
        <td><div class="row" style="gap:4px;flex-wrap:nowrap">
          ${t.can_abort?`<button class="btn ghost sm" data-abort="${t.id}">放弃</button>`:''}
          ${t.can_retry?`<button class="btn ghost sm" data-retry="${t.id}">重试</button>`:''}</div></td>
      </tr>`).join('')}</tbody></table>`:`${emptyState({icon:'tasks',title:'还没有后台任务',desc:'上传 PDF、导入题库、生成视频笔记都会在这里留下记录与进度。'})}`}</div>`;
  document.getElementById('treload').onclick=()=>pageTasks(v);
  const tc=document.getElementById('tclean');
  if(tc) tc.onclick=async()=>{
    try{ const r=await api('/tasks/cleanup',{method:'POST'}); toast('已清理 '+(r.deleted||0)+' 条'); pageTasks(v); }
    catch(e){ toast(e.message); }
  };
  v.querySelectorAll('[data-abort]').forEach(b=>b.onclick=async()=>{
    if(!confirm('放弃这个任务？已产生的中间结果会丢弃。')) return;
    b.disabled=true; b.textContent='…';
    try{ await api('/tasks/'+b.dataset.abort+'/abort',{method:'POST'});
      toast('已放弃该任务'); pageTasks(v);
    }catch(e){ toast(e.message); b.disabled=false; b.textContent='放弃'; }
  });
  v.querySelectorAll('[data-retry]').forEach(b=>b.onclick=async()=>{
    b.disabled=true; b.textContent='…';
    try{ const r=await api('/tasks/'+b.dataset.retry+'/retry',{method:'POST'});
      toast('已重新入队 #'+(r.task_id||'')); pageTasks(v);
    }catch(e){ toast(e.message); b.disabled=false; b.textContent='重试'; }
  });
}
function summarize(r){
  if(!r) return '';
  const parts=[];
  if(r.cards!=null) parts.push(r.cards+' 张卡片');
  if(r.chunks!=null) parts.push(r.chunks+' 块');
  if(r.questions!=null) parts.push(r.questions+' 题');
  if(r.plan_id!=null) parts.push('计划#'+r.plan_id);
  if(r.layout_id!=null) parts.push('布局#'+r.layout_id);
  if(r.segments!=null) parts.push(r.segments+' 段');
  return parts.join(' · ')||JSON.stringify(r).slice(0,60);
}

function fmtTime(ts){ if(!ts) return '—'; const d=new Date(ts); if(isNaN(d.getTime())) return '—';
  const diff=(Date.now()-d.getTime())/86400000;
  if(diff<1) return '今天'; if(diff<2) return '昨天'; if(diff<7) return Math.floor(diff)+' 天前';
  return d.toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}); }

async function genDash(){

const BASE_SPAN={stat:3,ring:4,progress:4,list:5,bar:6,line:6};
function layoutRows(items){
  const rows=[]; let cur=[], sum=0;
  for(const it of items){
    if(cur.length && sum+it.span>12){ rows.push(cur); cur=[]; sum=0; }
    cur.push(it); sum+=it.span;
  }
  if(cur.length) rows.push(cur);
  return rows;
}

function dashGrid(d){
  const cfg=d.config||{}; const cards=cfg.cards||[];
  const order=(d.order&&d.order.length?d.order:cards.map(c=>c.id));

  cards.forEach(c=>{if(!sorted.find(x=>x.id===c.id))sorted.push(c);});
  const pos=d.positions||{};
  const items=sorted.map(cd=>{
    const want=(pos[cd.id]&&+pos[cd.id].span)||BASE_SPAN[cd.type]||4;
    const isChart=(cd.type==='bar'||cd.type==='line');
    return {cd, span:Math.max(isChart?6:2, Math.min(12,want))};
  });

  const scopeLabel={day:'日',week:'周',month:'月'}[d.scope||'week']||'周';

}
function cardBody(cd){
  const v=cd.value??'', unit=cd.unit||'';
  /* 「真实数据：」在每张卡都出现是噪音，去掉前缀只留信息 */
  const hint=(cd.hint||'').replace(/^真实数据[:：]\s*/,'');
  if(cd.type==='stat'){
    const num = (unit==='张') ? `<span class="hl">${esc(v)}</span>` : esc(v);
    return `<div class="dv">${num}<small>${esc(unit)}</small></div>${hint?`<div class="dh">${esc(hint)}</div>`:''}`;
  }
  if(cd.type==='bar'){ const data=cd.data||[]; const mx=Math.max(1,...data.map(x=>+x.value||0));
    if(data.length && data.every(x=>!(+x.value)))
      return `<div class="dh" style="margin-top:20px">这段时间还没有作答记录</div>`;
    return `<div class="bars">${data.map(x=>{const v=+x.value||0;
      return `<div class="b ${v===0?'zero':''} ${v>0&&v>=mx?'peak':''}"><i style="height:${v===0?2:Math.max(4,v/mx*80)}px"></i><span>${esc(x.label)}</span></div>`;
    }).join('')}</div>`; }
  if(cd.type==='line'){ const data=cd.data||[]; const mx=Math.max(1,...data.map(x=>+x.value||0));
    const W=320,H=90,padX=6,padY=10,n=data.length;
    const pts=data.map((x,i)=>[padX+(n>1?i*(W-2*padX)/(n-1):W/2),
      H-padY-(((+x.value||0)/mx)*(H-2*padY))]);
    let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for(let i=0;i<pts.length-1;i++){
      const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
      const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
      const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
      d+=` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
    }
    const area=`${d} L${pts[n-1][0].toFixed(1)} ${H} L${pts[0][0].toFixed(1)} ${H} Z`;
    const grid=[0,.5,1].map(t=>{const y=(padY+(H-2*padY)*t).toFixed(1);
      return `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--border)" stroke-width="1" vector-effect="non-scaling-stroke"/>`;}).join('');
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:92px;margin-top:8px;display:block">
      ${grid}
      <path d="${area}" fill="var(--primary)" opacity=".05"/>
      <path d="${d}" fill="none" stroke="var(--primary)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
      ${pts.map(pp=>`<circle cx="${pp[0].toFixed(1)}" cy="${pp[1].toFixed(1)}" r="2.2" fill="var(--card)" stroke="var(--primary)" stroke-width="1.75" vector-effect="non-scaling-stroke"/>`).join('')}
    </svg>
      <div style="display:flex;justify-content:space-between;margin-top:6px">
        ${data.map(x=>`<span style="font-size:10.5px;color:var(--muted-foreground);font-family:var(--mono)">${esc(x.label)}</span>`).join('')}
      </div>`; }
  if(cd.type==='ring'){ const val=+v||0, mx=+cd.max||100, pct=Math.min(100,val/mx*100);
    const r=33,c=2*Math.PI*r,off=c*(1-pct/100);
    return `<svg viewBox="0 0 90 90" width="112" height="112" style="display:block;margin:4px auto">
      <circle cx="45" cy="45" r="${r}" fill="none" stroke="var(--secondary)" stroke-width="9"/>
      <circle cx="45" cy="45" r="${r}" fill="none" stroke="var(--primary)" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 45 45)"/>
      <text x="45" y="50" text-anchor="middle" font-size="16" font-weight="500" fill="var(--foreground)" style="font-family:var(--mono)">${Math.round(pct)}%</text></svg>
      ${hint?`<div class="dh" style="text-align:center">${esc(hint)}</div>`:''}`; }
  if(cd.type==='progress'){ const val=+v||0, mx=+cd.max||100, pct=Math.min(100,val/mx*100);
    return `<div class="dv">${Math.round(pct)}<small>%</small></div><div class="prog"><i style="width:${pct}%"></i></div>
      ${hint?`<div class="dh">${esc(hint)}</div>`:''}`; }
  if(cd.type==='list'){ return `<ul class="dlist">${(cd.items||[]).map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`; }
  return '';
}
async function saveCardContent(layoutId, card){
  const cid=card.dataset.cid;
  const get=f=>{const el=card.querySelector(`[data-f="${f}"]`); return el?el.value:null;};
  const payload={card_id:cid, title:get('title')};
  const hint=get('hint'); if(hint!==null) payload.hint=hint;
  const v=get('value'); if(v!==null) payload.value=v;
  const u=get('unit'); if(u!==null) payload.unit=u;
  const mx=get('max'); if(mx!==null && String(mx).trim()!=='') payload.max=+mx;
  const it=get('items'); if(it!==null) payload.items=it.split('\n').map(s=>s.trim()).filter(Boolean);
  const labels=[...card.querySelectorAll('[data-f="label"]')];
  if(labels.length){
    payload.data=labels.map((el,i)=>{
      const vEl=card.querySelectorAll('[data-f="val"]')[i];
      return {label:el.value.trim()||('项'+(i+1)), value:Number((vEl&&vEl.value)||0)};
    });
  }
  try{
    const r=await api('/dashboard/'+layoutId+'/card',{method:'PATCH',body:JSON.stringify(payload)});
    const cd=((S.dash.config||{}).cards||[]).find(c=>c.id===cid);
    if(cd) Object.assign(cd, r.card||{});
    card.classList.remove('flipped');
    setTimeout(()=>render(), 280);
    toast('已保存');
  }catch(e){ toast(e.message); }
}

function bindDrag(layoutId){
  const grid=document.getElementById('dashgrid'); if(!grid) return;
  let dragId=null;
  grid.querySelectorAll('.dcard').forEach(card=>{
    const front=card.querySelector('.dfront');
    // 双击翻转：正面⇄背面（同时只允许一张展开）
    if(front) front.addEventListener('dblclick',e=>{
      if(e.target.closest('.rz')) return;
      e.stopPropagation();
      grid.querySelectorAll('.dcard.flipped').forEach(c=>{if(c!==card) c.classList.remove('flipped');});
      card.classList.toggle('flipped');
      if(card.classList.contains('flipped')){
        const first=card.querySelector('.dback input, .dback textarea');
        if(first) setTimeout(()=>first.focus(),260);
      }
    });
    const add=card.querySelector('.dadd');
    if(add) add.onclick=e=>{
      e.stopPropagation();
      const box=card.querySelector('.drows'); if(!box) return;
      const div=document.createElement('div'); div.className='drow-edit';
      div.innerHTML='<input class="mini" data-f="label" placeholder="标签">'+
        '<input class="mini dnum" data-f="val" placeholder="值"><button class="btn ghost sm ddel" type="button">×</button>';
      box.appendChild(div); bindRowDel(div); box.scrollTop=box.scrollHeight;
    };
    card.querySelectorAll('.ddel').forEach(b=>bindRowDel(b.parentElement));
    function bindRowDel(row){
      const btn=row.querySelector('.ddel'); if(!btn) return;
      btn.onclick=ev=>{ev.stopPropagation(); row.remove();};
    }
    const sv=card.querySelector('[data-save]');
    if(sv) sv.onclick=e=>{e.stopPropagation(); saveCardContent(layoutId, card);};
    const cn=card.querySelector('[data-cancel]');
    if(cn) cn.onclick=e=>{e.stopPropagation(); card.classList.remove('flipped');};

    card.addEventListener('dragstart',e=>{
      if(card.classList.contains('flipped')){ e.preventDefault(); return; }
      dragId=card.dataset.cid; card.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    card.addEventListener('dragend',()=>card.classList.remove('dragging'));
    card.addEventListener('dragover',e=>e.preventDefault());
    card.addEventListener('drop',async e=>{
      e.preventDefault();
      if(!dragId||dragId===card.dataset.cid) return;
      const ids=[...grid.querySelectorAll('.dcard')].map(x=>x.dataset.cid);
      const from=ids.indexOf(dragId),to=ids.indexOf(card.dataset.cid);
      if(from<0||to<0) return;
      ids.splice(to,0,ids.splice(from,1)[0]);
      const pos={}; grid.querySelectorAll('.dcard').forEach(c=>{pos[c.dataset.cid]={span:+c.dataset.span||4};});
      S.dash.order=ids; S.dash.positions=pos; render();
      try{ await api('/dashboard/'+layoutId+'/order',{method:'PUT',
        body:JSON.stringify({order:ids,positions:pos,scope:S.dash.scope||'week'})}); toast('布局已保存'); }
      catch(err){ toast(err.message); }
    });
  });
  // 右下角缩放（hover 即出现，不需要任何模式）
  grid.querySelectorAll('.rz').forEach(h=>{
    h.addEventListener('mousedown',e=>{
      e.preventDefault(); e.stopPropagation();
      const card=h.closest('.dcard'); const row=card.parentElement;
      if(!row) return;
      card.classList.add('resizing');
      const startX=e.clientX;
      const sp0=+card.dataset.span||4;
      const unit=Math.max(22,row.getBoundingClientRect().width/12);
      let moved=false;
      const mv=ev=>{
        moved=true;
        const d=Math.round((ev.clientX-startX)/unit);
        const cur=Math.max(2,Math.min(12,sp0+d));
        card.dataset.span=cur; card.style.flex=cur+' 1 0';
      };
      const up=async()=>{
        window.removeEventListener('mousemove',mv);
        window.removeEventListener('mouseup',up);
        card.classList.remove('resizing');
        if(!moved) return;
        await savePositions(layoutId); render(); toast('已调整大小');
      };
      window.addEventListener('mousemove',mv);
      window.addEventListener('mouseup',up);
    });
  });
}

function mdToHtml(md){
  if(!md) return '';
  let s=esc(md);
  s=s.replace(/```([\s\S]*?)```/g,(m,code)=>'<pre><code>'+code.replace(/^\n/,'')+'</code></pre>');
  s=s.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
  s=s.replace(/^&gt; (.*)$/gm,'<blockquote>$1</blockquote>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/^\s*[-*] (.*)$/gm,'<li>$1</li>');
  s=s.replace(/^\s*(\d+)\. (.*)$/gm,'<li>$2</li>');
  s=s.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,'<ul>$1</ul>');
  s=s.replace(/\n{2,}/g,'</p><p>');
  return '<p>'+s+'</p>';
}
function treeHtml(nodes, depth){

        <span class="caret ${open?'open':''}" data-toggle="${n.id}">${kids.length?ICONS.chevronRight:''}</span>

      ${kids.length?`<ul class="ftree" data-kids="${n.id}" style="${open?'':'display:none'}">${treeHtml(kids,depth+1)}</ul>`:''}
    </li>`;
  }).join('');
}

          <button class="btn ghost sm" data-npage="next" ${(S.notesPage||1)>=(S.notesPages||1)?'disabled':''}>下一页</button>
        </div>`:''}
      </div>
    </div>
    <div class="pane">
      ${cur?`<div class="editor">
        <div class="editor-head">
          <input id="nTitle" value="${esc(cur.title||'')}" placeholder="笔记标题">
          <div class="tabs" id="nMode">
            <button data-m="edit" class="${S.nPreview?'':'on'}">编辑</button>
            <button data-m="view" class="${S.nPreview?'on':''}">预览</button>
          </div>
          <button class="btn sm" id="nSave">保存</button>
          <button class="btn ghost sm" id="nCards" title="把笔记转成背诵卡片">转卡片</button>

      </div>`:emptyState({icon:'notes',title:'选一篇笔记开始',desc:'从左侧挑一篇，或在列表上方点「＋」新建。右侧 AI 可以按指令补写，写不写进去由你决定。'})}
    </div>
    <div class="pane ai-panel" data-col="nb3">
      <div class="pane-head"><span>AI 协作</span>
        <span class="badge blue" id="aiNoteName" style="font-weight:400">${cur?esc((cur.title||'').slice(0,10)):'未选笔记'}</span></div>
      <div class="ai-thread" id="aiThread">${thread.length?thread.map((m,i)=>`
        <div class="ai-msg ${m.role==='me'?'me':''}">${esc(m.text)}
          ${m.role==='ai'?`<div class="acts">
            <button class="btn sm" data-ins="${i}" data-pos="append">插入到末尾</button>
            <button class="btn outline sm" data-ins="${i}" data-pos="replace">替换全文</button>
            <button class="btn ghost sm" data-drop="${i}">放弃</button></div>`:''}
        </div>`).join(''):`<div class="muted" style="font-size:12.5px;line-height:1.8;padding:4px">
          可以润色、扩展、提炼要点、出题。生成的内容先给你看，点「插入」才写进笔记。</div>`}
      </div>
      <div class="ai-input">
        <div class="tabs" id="aiModes">
          <button data-a="improve" class="${S.aiMode==='improve'?'on':''}">润色</button>
          <button data-a="expand" class="${S.aiMode==='expand'?'on':''}">扩展</button>
          <button data-a="summarize" class="${S.aiMode==='summarize'?'on':''}">提炼</button>
          <button data-a="quiz" class="${S.aiMode==='quiz'?'on':''}">出题</button>
        </div>
        <textarea id="aiAsk" placeholder="补充指令（可空），例如：补上三个易错点"></textarea>
        <button class="btn sm" id="aiSend" ${cur?'':'disabled'}>生成建议</button>
      </div>
    </div>
  </div>`;

  // 编辑器内容
  const body=document.getElementById('nBody');
  if(body && cur){
    if(S.nPreview){
      body.innerHTML=`<div class="mdview">${mdToHtml(cur.content||cur.summary||'')}</div>`;
    }else{
      body.innerHTML=`<textarea id="nContent" placeholder="用 Markdown 写：\n# 标题\n- 要点\n**重点**">${esc(cur.content||cur.summary||'')}</textarea>`;
    }
    if(S.nPreview) typeset(body);
    document.querySelectorAll('#nMode button').forEach(b=>b.onclick=()=>{
      S.nPreview=(b.dataset.m==='view');
      // 保存未提交内容
      const ta=document.getElementById('nContent');
      if(ta) cur.content=ta.value;
      render();
    });
    document.getElementById('nSave').onclick=async()=>{
      const t=document.getElementById('nTitle').value.trim();
      const c=document.getElementById('nContent');
      const content=c? c.value : (cur.content||'');
      try{ const r=await api('/notes/'+cur.id,{method:'PATCH',body:JSON.stringify({title:t||'未命名',content})});
        S.curNote=Object.assign(cur,r); toast('已保存'); await refresh();
      }catch(e){ toast(e.message); }
    };
    document.getElementById('nCards').onclick=async()=>{
      try{ const r=await api('/notes/'+cur.id+'/to-cards',{method:'POST'});
        toast('已生成 '+(r.cards||0)+' 张卡片'); await refresh();
      }catch(e){ toast(e.message); }
    };
  }
  // 文件夹操作
  v.querySelectorAll('[data-folder]').forEach(el=>el.onclick=async(e)=>{
    if(e.target.dataset.toggle) return;
    const id=el.dataset.folder;
    S.folderId = id==='all'? null : +id;
    S.notesPage=1;
    await refresh();
  });
  v.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const ul=document.querySelector(`[data-kids="${el.dataset.toggle}"]`);
    if(ul){ const hide=ul.style.display!=='none'; ul.style.display=hide?'none':'block';
      el.classList.toggle('open',hide); }
  });
  const nf=document.getElementById('newFolder');
  if(nf) nf.onclick=async()=>{
    const name=prompt('文件夹名称（如：考研 / 数学 / 极限）'); if(!name) return;
    const parent=prompt('挂在哪个文件夹下？输入文件夹 ID（留空=顶层）',''); 
    const kind=prompt('类型：project(项目) / subject(科目) / topic(内容)','topic')||'topic';
    try{ await api('/notes/folders',{method:'POST',body:JSON.stringify({
        name, parent_id: parent? +parent : null, kind})});
      toast('已创建'); await refresh();
    }catch(e){ toast(e.message); }
  };
  v.querySelectorAll('[data-npage]').forEach(b=>b.onclick=()=>{
    const d=b.dataset.npage==='next'?1:-1;
    S.notesPage=Math.max(1,Math.min(S.notesPages||1,(S.notesPage||1)+d));
    refresh();
  });
  const tb=document.getElementById('tidyBtn');
  if(tb) tb.onclick=()=>openTidy();
  const nn=document.getElementById('newNote');
  if(nn) nn.onclick=async()=>{
    const title=prompt('笔记标题','新笔记'); if(!title) return;
    try{ const n=await api('/notes',{method:'POST',body:JSON.stringify({
        title, content:'', folder_id:S.folderId, kind:'note', source:'manual'})});
      S.curNote=n; await refresh();
    }catch(e){ toast(e.message); }
  };
  v.querySelectorAll('[data-note]').forEach(el=>el.onclick=()=>{
    S.curNote=notes.find(n=>n.id==el.dataset.note)||null;
    S.aiThread=[];
    // 视频/AI 生成的笔记默认看渲染结果，手记默认进编辑
    S.nPreview = !!(S.curNote && (S.curNote.source==='video' || S.curNote.source==='ai'));
    render();
  });
  // AI
  document.querySelectorAll('#aiModes button').forEach(b=>b.onclick=()=>{
    S.aiMode=b.dataset.a; render();
  });
  const send=document.getElementById('aiSend');
  if(send) send.onclick=async()=>{
    if(!S.curNote) return toast('先选一篇笔记');
    const ta=document.getElementById('nContent');
    const content=ta? ta.value : (S.curNote.content||'');
    const instruction=(document.getElementById('aiAsk').value||'').trim();
    S.aiThread.push({role:'me',text:'【'+({improve:'润色',expand:'扩展',summarize:'提炼',quiz:'出题'}[S.aiMode])+'】'+(instruction||'（默认）')});
    render();
    const tid=document.getElementById('aiThread');
    if(tid) tid.innerHTML+='<div class="ai-msg" id="aiWait"><span class="spin"></span> 正在生成建议…</div>';
    try{
      const r=await api('/notes/ai-suggest',{method:'POST',body:JSON.stringify({
        note_id:S.curNote.id, title:S.curNote.title, content, instruction, mode:S.aiMode})});
      S.aiThread.push({role:'ai',text:r.suggestion||'（模型没返回内容）',points:r.points||[]});
    }catch(e){ S.aiThread.push({role:'ai',text:'生成失败：'+e.message}); }
    render();
  };
  v.querySelectorAll('[data-ins]').forEach(b=>b.onclick=async()=>{
    const m=thread[+b.dataset.ins]; if(!m) return;
    try{ const r=await api('/notes/insert',{method:'POST',body:JSON.stringify({
        note_id:S.curNote.id, text:m.text, position:b.dataset.pos})});
      S.curNote=Object.assign(S.curNote,r);
      S.aiThread=S.aiThread.filter(x=>x!==m);
      toast('已写入笔记'); await refresh();
    }catch(e){ toast(e.message); }
  });
  v.querySelectorAll('[data-drop]').forEach(b=>b.onclick=()=>{
    S.aiThread=S.aiThread.filter((_,i)=>i!=+b.dataset.drop); render();
  });
  enableColResize();
}
async function openTidy(){
  let m=document.getElementById('tidyModal');
  if(!m){ m=document.createElement('div'); m.id='tidyModal'; m.className='modal'; document.body.appendChild(m); }
  m.classList.add('show');
  m.innerHTML=`<div class="modal-card">
    <h3>AI 整理</h3>
    <div class="muted" style="font-size:12.5px">分析当前文件夹的笔记，给出合并、归类与缺失建议（不会自动改动）</div>
    <div id="tidyBody" style="margin-top:16px"><span class="spin"></span> 分析中，约 10–20 秒…</div></div>`;
  m.onclick=e=>{ if(e.target===m) m.classList.remove('show'); };
  try{
    const r=await api('/notes/tidy',{method:'POST',body:JSON.stringify({folder_id:S.folderId})});
    const merge=r.merge||[], folders=r.folders||[], missing=r.missing||[];
    document.getElementById('tidyBody').innerHTML=`
      <div class="tidy-item">${esc(r.summary||'（无总结）')}</div>
      <div class="muted" style="font-size:11.5px;margin-top:6px">扫描 ${r.scanned||0} 篇 · ${esc(r.folder||'')}</div>
      ${folders.length?`<div class="tidy-sec"><div class="th">建议新建的归类文件夹</div>
        ${folders.map(g=>`<div class="tidy-item">
          <div class="row between"><b>${esc(g.name)}</b>
            <button class="btn sm" data-apply="${esc(g.name)}" data-ids='${JSON.stringify(g.note_ids||[])}'>建文件夹并移入</button></div>
          <div class="rm">${esc(g.reason||'')}</div>
          <div class="muted" style="font-size:11.5px;margin-top:4px">包含：${(g.titles||[]).map(esc).join('、')}</div>
        </div>`).join('')}</div>`:''}
      ${merge.length?`<div class="tidy-sec"><div class="th">可能重复、建议合并</div>
        ${merge.map(g=>`<div class="tidy-item">${(g.titles||[]).map(esc).join(' + ')}
          <div class="rm">${esc(g.reason||'')}</div></div>`).join('')}</div>`:''}
      ${missing.length?`<div class="tidy-sec"><div class="th">建议补充的知识点</div>
        <div class="tidy-item">${missing.map(esc).join('、')}</div></div>`:''}
      <div class="row" style="justify-content:flex-end;margin-top:18px">
        <button class="btn ghost sm" id="tidyClose">关闭</button></div>`;
    document.getElementById('tidyClose').onclick=()=>m.classList.remove('show');
    document.querySelectorAll('[data-apply]').forEach(b=>b.onclick=async()=>{
      const ids=JSON.parse(b.dataset.ids||'[]');
      if(!ids.length) return toast('这条建议没有可移动的笔记');
      try{
        const res=await api('/notes/tidy/apply',{method:'POST',body:JSON.stringify({
          folder_id:S.folderId, name:b.dataset.apply, note_ids:ids})});
        toast('已建「'+res.name+'」并移入 '+res.moved+' 篇');
        m.classList.remove('show'); await refresh();
      }catch(e){ toast(e.message); }
    });
  }catch(e){
    const b2=document.getElementById('tidyBody'); if(b2) b2.innerHTML='<div class="empty">'+esc(e.message)+'</div>';
  }
}
function pageDocs(v){

      toast('解析完成：'+(r.chunks||0)+' 块'); await refresh();
    }catch(e){ toast(e.message); } finally{ b.disabled=false; b.textContent='解析'; }
  });
  v.querySelectorAll('[data-cards]').forEach(b=>b.onclick=async()=>{
    b.disabled=true;b.textContent='生成中';
    try{ const r=await runTask('/documents/'+b.dataset.cards+'/cards',{method:'POST'},'生成卡片');
      toast('生成 '+(r.cards||0)+' 张卡片'); await refresh();
    }catch(e){ toast(e.message); } finally{ b.disabled=false; b.textContent='生成卡片'; }

  v.querySelectorAll('[data-rename]').forEach(b=>b.onclick=async()=>{
    const d=docs.find(x=>x.id==b.dataset.rename); if(!d) return;

    if(!confirm('删除这条笔记？')) return;

function noteForm(n){

  const docs=S.docs||[];

    <div style="margin:8px 0 4px">
      ${n?'':'<select id="nDoc" style="margin-bottom:8px">'+docs.map(d=>`<option value="${d.id}">${esc(d.title)}</option>`).join('')+'</select>'}
      <input id="nTitle" placeholder="笔记标题" value="${n?esc(n.title||''):''}">
      <textarea id="nSum" placeholder="笔记内容" style="min-height:90px;margin-top:8px">${n?esc(n.summary||''):''}</textarea>
      <input id="nPoints" placeholder="要点，用换行分隔" style="margin-top:8px" value="${n?esc((n.points||[]).join(' / ')):''}">

        <button class="btn ghost sm" id="nCancel">取消</button></div>
    </div>`;
  document.getElementById('nCancel').onclick=()=>{box.innerHTML='';};
  document.getElementById('nSave').onclick=async()=>{
    const title=document.getElementById('nTitle').value.trim();
    const summary=document.getElementById('nSum').value;
    const points=document.getElementById('nPoints').value.split(/\n|\//).map(s=>s.trim()).filter(Boolean);
    if(!title) return toast('请填写标题');
    try{
      if(n) await api('/notes/'+n.id,{method:'PATCH',body:JSON.stringify({title,summary,points})});
      else{
        const docId=+document.getElementById('nDoc').value;
        await api('/documents/'+docId+'/notes',{method:'POST',body:JSON.stringify({title,summary,points})});
      }
      toast('已保存'); await refresh();
    }catch(e){ toast(e.message); }
  };
}

async function openDeck(deckId){
  const box=document.getElementById('deckCards'); if(!box) return;
  box.innerHTML='<div class="card"><span class="spin"></span> 加载中…</div>';

function msgHtml(m){
  const mode=m.mode||'';
  const badge = mode==='knowledge'?'<span class="badge blue">知识库</span>'
    : mode==='web'?'<span class="badge warn">联网检索</span>'
    : mode==='model'?'<span class="badge">学科知识</span>'
    : mode==='none'?'<span class="badge">未找到依据</span>':'';
  const src=(m.sources||[]).map(s=>{
    if(s.url) return `<a class="s" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title||s.url)}</a>`;
    return `<span class="s">第 ${s.page||'?'} 页</span>`;
  }).join('');
  // 过程可视化：检索资料 → 核对来源 → 生成回答（Beautiful UI 状态行轮换）
  let proc='';
  if(m.showProc){
    const stages=['检索资料','核对来源','生成回答'];
    const cur=m.stage==null?0:m.stage;
    const el=m.elapsed!=null?m.elapsed.toFixed(1):'0.0';
    proc=`<div class="aiproc">${stages.map((s,i)=>
      `<span class="step ${i<cur?'done':(i===cur?'active':'')}"><span class="dot"></span>${s}</span>`).join('')}
      <span class="elapsed">${el}s</span></div>`;
  }
  // 思考轨迹：展示真实检索依据，不伪造推理过程
  let trace='';
  if((m.trace||[]).length){
    trace=`<details class="think"><summary><span class="caret">▸</span> 检索依据（${m.trace.length}）</summary>
      <div class="trace">${m.trace.map(t=>`<div>· ${esc(t)}</div>`).join('')}</div></details>`;
  }
  // 进行中：过程行代替转圈；有文本后显示气泡 + 流式光标
  const busy=!!(m.pending||m.streaming);
  let bubble='';
  if(m.text||m.role==='user'||!busy){
    const body=m.role==='bot'?mdToHtml(m.text):esc(m.text);
    bubble=`<div class="bubble">${body}${m.streaming?'<span class="stream-caret"></span>':''}</div>`;
  }
  // follow-up 建议问题
  let fu='';
  if(!busy && (m.followups||[]).length){
    fu=`<div class="followups">${m.followups.map(q=>
      `<button class="fu" data-fu="${esc(q)}"><span class="ic">${ICONS.spark}</span>${esc(q)}</button>`).join('')}</div>`;
  }
  return `<div class="msg ${m.role}"><div class="who">${m.role==='user'?'你':'AI'}</div>
    <div style="min-width:0">${proc}${trace}${bubble}
    ${(badge||src)?`<div class="src">${badge}${src}</div>`:''}${fu}</div></div>`;
}
function genFollowups(mode){
  const base = mode==='web'
    ? ['这个结论有最新数据吗？','能给出官方网站出处吗？','换一个观点对比一下']
    : mode==='knowledge'
    ? ['能标出具体页码吗？','这部分怎么用在题目里？','还有相关的其他考点吗？']
    : ['能举一个具体的例子吗？','能再简化一点吗？','展开讲讲推导过程'];
  return base.slice(0,3);
}
function renderChatOnly(){
  const chat=document.getElementById('chat'); if(!chat) return;
  chat.innerHTML=(S.qaMsgs||[]).map(m=>msgHtml(m)).join('');
  chat.scrollTop=chat.scrollHeight;
  typeset(chat);

async function doAsk(){
  const inp=document.getElementById('ask'); if(!inp) return;
  const q=inp.value.trim(); if(!q) return;
  S.qaMsgs.push({role:'user',text:q}); inp.value='';
  const idx=S.qaMsgs.length;
  const t0=Date.now();
  S.qaMsgs.push({role:'bot',text:'',pending:true,showProc:true,stage:0,elapsed:0});
  render();
  let full='', meta=null, lastPaint=0, stage=0;
  // 耗时计数（Beautiful UI：已耗时显示，让等待可感知）
  const timer=setInterval(()=>{
    const m=S.qaMsgs[idx];
    if(m){ m.elapsed=(Date.now()-t0)/1000; renderChatOnly(); }
  },200);
  const bump=(s)=>{ if(s>stage){ stage=s; } };
  const paint=()=>{
    S.qaMsgs[idx]={role:'bot',text:full,pending:!full,streaming:true,
                   hint:meta&&meta.hint,mode:meta&&meta.mode,sources:(meta&&meta.sources)||[],
                   showProc:true,stage,elapsed:(Date.now()-t0)/1000};
    renderChatOnly();
  };
  try{
    const res=await fetch('/api/qa/stream',{method:'POST',credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:q,strategy:S.qaStrategy||'auto'})});
    if(!res.ok||!res.body) throw new Error('请求失败 '+res.status);
    const reader=res.body.getReader(); const dec=new TextDecoder();
    let buf='';
    while(true){
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let nl;
      while((nl=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,nl); buf=buf.slice(nl+1);
        if(!line.trim()) continue;
        let ev; try{ ev=JSON.parse(line); }catch(e){ continue; }
        if(ev.type==='status'){ meta={...(meta||{}),hint:ev.hint}; bump(0); paint(); }
        else if(ev.type==='sources'||ev.type==='meta'){
          meta={...(meta||{}),mode:ev.mode,sources:ev.sources||[],hint:ev.hint}; bump(1); paint();
        }
        else if(ev.type==='delta'||ev.type==='notice'){ full+=ev.text||''; bump(2); }
        else if(ev.type==='done'){ if(ev.full) full=ev.full; bump(2); }
        else if(ev.type==='error'){ toast(ev.message||'生成中断'); }
      }
      const now=Date.now();
      if(now-lastPaint>90){ lastPaint=now; paint(); }
    }
    clearInterval(timer);
    const finalMode=meta&&meta.mode;
    const srcs=(meta&&meta.sources)||[];
    // 思考轨迹：展示真实命中的依据，不编造推理
    const trace=srcs.map(s=>s.url?`联网：${s.title||s.url}`:
      (s.page?`资料第 ${s.page} 页`+(s.title?` · ${s.title}`:''):(s.title||'资料片段'))).slice(0,5);
    S.qaMsgs[idx]={role:'bot',text:full||'（没有返回内容）',pending:false,streaming:false,
                   mode:finalMode,sources:srcs,showProc:false,stage:3,
                   elapsed:(Date.now()-t0)/1000,trace,followups:genFollowups(finalMode)};
    render();
  }catch(e){
    clearInterval(timer);
    S.qaMsgs[idx]={role:'bot',text:'出错：'+e.message,showProc:false};
    render();
  }
}

/* ---------- 视频：左视频+关键帧 / 右笔记树 ---------- */
function fmtTs(sec){
  const s=Math.max(0,Math.round(sec||0));
  const m=Math.floor(s/60), r=s%60;
  return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0');
}
const VTPL=[['summary','摘要'],['outline','大纲'],['qa','问答'],['frames','图文']];
function mdToTree(md){
  const root={children:[]}, stack=[{level:0,node:root}];
  (md||'').split('\n').forEach(line=>{
    if(!line.trim()) return;
    let m, level, text;
    if((m=line.match(/^(#{1,4})\s+(.*)$/))){ level=m[1].length; text=m[2]; }
    else if((m=line.match(/^[\s]*[-*]\s+(.*)$/))){ level=6; text=m[1]; }
    else { level=7; text=line; }
    text=text.replace(/\*\*/g,'').trim();
    if(!text) return;
    const node={text,level,children:[]};
    while(stack.length>1 && stack[stack.length-1].level>=level) stack.pop();
    stack[stack.length-1].node.children.push(node);
    stack.push({level,node});
  });
  return root.children;
}
function vtreeHtml(nodes, depth, key){
  if(!nodes||!nodes.length) return '';
  return `<ul>${nodes.map((n,i)=>{
    const hasChild=n.children&&n.children.length;
    const lv=depth===0?'lv1':(depth===1?'lv2':'lv3');
    return `<li><div class="tn ${lv}">
      ${hasChild?`<span class="fold" data-fold="1"><span class="caret">${ICONS.chevronDown}</span></span>`
                :'<span class="bullet">•</span>'}
      <span>${esc(n.text)}</span></div>
      ${hasChild?vtreeHtml(n.children,depth+1,(key||'')+'-'+i):''}</li>`;
  }).join('')}</ul>`;
}
