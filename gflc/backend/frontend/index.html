  });
  const vf=document.getElementById('vf');
  if(vf) vf.onchange=async e=>{const f=e.target.files[0]; if(!f) return;
    const msg=document.getElementById('vmsg'); msg.innerHTML='<span class="spin"></span> 已提交后台处理…';
    try{ const fd=new FormData(); fd.append('file',f);
      fd.append('templates',(S.vTpls||['summary']).join(','));
      const r=await runTask('/videos/upload',{method:'POST',body:fd},'视频转写');
      applyVideoResult(r); await loadVideos(); render();
    }catch(err){ msg.textContent=''; toast(err.message); }};
  const vlk=document.getElementById('vlink');
  if(vlk) vlk.onclick=async()=>{
    const url=document.getElementById('vurl').value.trim(); if(!url) return toast('请粘贴链接');
    const msg=document.getElementById('vmsg'); msg.innerHTML='<span class="spin"></span> 已提交（下载+转写）…';
    try{ const r=await runTask('/videos/url',{method:'POST',body:JSON.stringify({
        url, templates:S.vTpls||['summary']})},'链接视频');
      applyVideoResult(r); await loadVideos(); render();
    }catch(err){ msg.innerHTML=''; toast(err.message); }};
  document.querySelectorAll('#vtabs button').forEach(b=>b.onclick=()=>{
    if(b.disabled) return; S.vActive=b.dataset.vt; render();
  });
  v.querySelectorAll('[data-vopen]').forEach(b=>b.onclick=()=>openVideo(b.dataset.vopen));
  v.querySelectorAll('[data-vdel]').forEach(b=>b.onclick=async()=>{
    if(!confirm('删除该视频及其笔记？')) return;
    try{ await api('/videos/'+b.dataset.vdel,{method:'DELETE'}); toast('已删除');
      S.vNotes=[];S.transcript=[];S.vFrames=[]; await loadVideos(); render();
    }catch(e){ toast(e.message); }
  });
  v.querySelectorAll('.fold').forEach(f=>f.onclick=ev=>{
    ev.stopPropagation(); f.classList.toggle('closed');
  });
  const fstrip=v.querySelector('.fstrip');
  if(fstrip) fstrip.querySelectorAll('.fthumb').forEach(el=>el.onclick=()=>{
    const f=frames[+el.dataset.fidx]; if(!f) return;
    const box=v.querySelector('.vidmain');
    if(box) box.scrollTop=0;
    if(f.text) toast(f.ts_label+'：'+f.text.slice(0,80));
  });
  const vl=document.getElementById('vtl');
  if(vl) vl.querySelectorAll('.vseg').forEach(el=>el.onclick=()=>{
    vl.querySelectorAll('.vseg').forEach(x=>x.classList.remove('on'));
    el.classList.add('on');
    const p=v.querySelector('#vplayer video');
    if(p){ try{ p.currentTime=+el.dataset.ts||0; p.play(); }catch(e){} }
  });
}
function applyVideoResult(r){
  S.vNotes=r.notes||[];
  S.transcript=r.transcript||[];
  S.vFrames=(r.frames||[]).map(f=>({...f, name:(f.name||f.path||'').split(/[\\/]/).pop()}));
  S.vdocId=r.document_id;
  S.vTitle=r.title||'';
  S.vActive=(r.notes&&r.notes[0]&&r.notes[0].kind)||'summary';
  S.vFrameNote=r.frame_note||null;
  toast('完成：'+(r.notes||[]).length+' 种笔记'+(S.vFrames.length?' · '+S.vFrames.length+' 关键帧':''));
}
function renderVideoNote(n, frames){
  const md=n.content||'';
  if(n.kind==='outline'){
    const tree=mdToTree(md);
    return `<div class="vsec"><div class="vst">大纲 · 树状</div>
      <div class="muted" style="font-size:12px;margin-bottom:10px">${esc(n.summary||'')}</div>
      <div class="vtree">${tree.length?vtreeHtml(tree,0,'r'):'<div class="empty">无大纲内容</div>'}</div></div>`;
  }
  if(n.kind==='frames'){
    const fn=S.vFrameNote||{};
    const secs=fn.sections||[];
    return `<div class="vsec"><div class="vst">图文笔记 · 关键帧</div>
      <div class="vstext">${esc(fn.summary||n.summary||'')}</div></div>
      ${secs.length?secs.map(s=>`<div class="vsec">
        <div class="vst">${esc(s.ts||'')} ${esc(s.title||'')}</div>
        <div class="vstext" style="white-space:pre-wrap">${esc(s.content||'')}</div></div>`).join('')
        :`<div class="vsec"><div class="mdview" style="padding:0">${mdLines(md)}</div></div>`}`;
  }
  return `<div class="vsec"><div class="vst">${({summary:'摘要',qa:'问答'})[n.kind]||'笔记'} · 正文</div>
    <div class="mdview" style="padding:0">${mdLines(md)}</div></div>`;
}
function mdLines(md){
  return esc(md||'').split('\n').map(line=>{
    if(/^#### /.test(line)) return `<h3 style="font-size:13px;margin:10px 0 4px">${line.slice(5)}</h3>`;
    if(/^### /.test(line)) return `<h3 style="font-size:14px;margin:12px 0 5px">${line.slice(4)}</h3>`;
    if(/^## /.test(line)) return `<h3 style="margin:14px 0 6px">${line.slice(3)}</h3>`;
    if(/^# /.test(line)) return `<h2 style="margin:16px 0 6px;font-size:17px">${line.slice(2)}</h2>`;
    if(/^[-*] /.test(line)) return `<li style="margin-left:16px">${line.slice(2)}</li>`;
    if(!line.trim()) return '<div style="height:7px"></div>';
    return `<p>${line}</p>`;
  }).join('');
}
async function loadVideos(){
  try{ S.vList=await api('/videos'); }catch(e){ S.vList=[]; }
}
async function openVideo(docId){
  try{
    const d=await api('/videos/'+docId+'/notes');
    S.vNotes=d.notes||[]; S.transcript=d.transcript||[]; S.vdocId=+docId;
    S.vFrames=(d.frames||[]).map(f=>({...f, name:(f.name||f.path||'').split(/[\\/]/).pop()}));
    S.vFrameNote=d.frame_note||null;
    S.vTitle=d.title||'';
    S.vActive=(d.notes&&d.notes[0]&&d.notes[0].kind)||'summary';
    render();
  }catch(e){ toast(e.message); }
}

boot();
</script>
</body>
</html>
