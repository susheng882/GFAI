<text x="340.0" y="40.0" font-size="14" fill="#0071E3" text-anchor="middle" font-weight="bold">数据模型与知识产物关系图（ER）</text>
<text x="340.0" y="58.0" font-size="9.8" fill="#6E6E73" text-anchor="middle">第七章 · 九类实体 · 1:N 关系 · 四存储职责边界 · 技术方案 2.1 / 2.5 / 2.7</text>
<line x1="24.0" y1="66.0" x2="656.0" y2="66.0" stroke="#1D1D1F" stroke-width="0.8"/>
<text x="656.0" y="40.0" font-size="8.8" fill="#6E6E73" text-anchor="end">GFLC · 2026</text>
<g transform="translate(24.00,14.66) scale(0.92941)"><g xmlns="http://www.w3.org/2000/svg" font-size="9.2">
    <rect x="36" y="78" width="176" height="118" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1.2"/>
    <rect x="36" y="78" width="176" height="22" fill="#0071E3"/>
    <text x="124" y="93" font-size="9.8" font-weight="bold" text-anchor="middle" fill="#FFF">users（用户）</text>
    <text x="46" y="116" font-size="9" fill="#333">id uuid PK · email / phone</text>
    <text x="46" y="130" font-size="9" fill="#333">password_hash（Argon2id ◆）</text>
    <text x="46" y="144" font-size="9" fill="#333">plan_tier · quota_daily</text>
    <text x="46" y="158" font-size="9" fill="#333">created_at · status</text>
    <text x="46" y="176" font-size="8.8" fill="#777">HttpOnly Cookie + Redis session ◆</text>
    <text x="46" y="188" font-size="8.8" fill="#777">会话态不落本表（§2.7）</text>

    <!-- 实体：materials -->
    <rect x="252" y="78" width="188" height="118" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1.2"/>
    <rect x="252" y="78" width="188" height="22" fill="#3A3A3C"/>
    <text x="346" y="93" font-size="9.8" font-weight="bold" text-anchor="middle" fill="#FFF">materials（原始资料）</text>
    <text x="262" y="116" font-size="9" fill="#333">id uuid PK · user_id FK</text>
    <text x="262" y="130" font-size="9" fill="#333">source_type（视频/PDF/题库/音频）</text>
    <text x="262" y="144" font-size="9" fill="#333">object_key → MinIO（S3）</text>
    <text x="262" y="158" font-size="9" fill="#333">duration_s · page_cnt · size_b</text>
    <text x="262" y="176" font-size="8.8" fill="#777">字节流走预签名直传，不进 API</text>
    <text x="262" y="188" font-size="8.8" fill="#777">确认以 stat 为准（§2.6，K1）</text>

    <!-- 实体：tasks -->
    <rect x="480" y="78" width="164" height="118" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1.2"/>
    <rect x="480" y="78" width="164" height="22" fill="#6E6E73"/>
    <text x="562" y="93" font-size="9.8" font-weight="bold" text-anchor="middle" fill="#FFF">tasks（AI 任务）</text>
    <text x="490" y="116" font-size="9" fill="#333">id uuid PK · material_id FK</text>
    <text x="490" y="130" font-size="9" fill="#333">task_type · model_tier · status</text>
    <text x="490" y="144" font-size="9" fill="#333">trace_id · cost_cny</text>
    <text x="490" y="158" font-size="9" fill="#333">schema_valid · degrade_level</text>
    <text x="490" y="176" font-size="8.8" fill="#777">状态机在 PG，任务态指针在 Redis</text>
    <text x="490" y="188" font-size="8.8" fill="#777">队列载荷 ≤ 4 KB（§2.5，K2）</text>

    <!-- 实体：knowledge_units -->
    <rect x="36" y="248" width="196" height="130" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1.2"/>
    <rect x="36" y="248" width="196" height="22" fill="#3A3A3C"/>
    <text x="134" y="263" font-size="9.8" font-weight="bold" text-anchor="middle" fill="#FFF">knowledge_units（知识单元）</text>
    <text x="46" y="286" font-size="9" fill="#333">id uuid PK · material_id FK</text>
    <text x="46" y="300" font-size="9" fill="#333">title_level · content · seq_no</text>
    <text x="46" y="314" font-size="9" fill="#333">start_ts / end_ts（时间戳溯源 ◆）</text>
    <text x="46" y="328" font-size="9" fill="#333">embedding vector(1024) ◆</text>
    <text x="46" y="342" font-size="9" fill="#333">source_ref（页码 / 视频秒数）</text>
    <text x="46" y="360" font-size="8.8" fill="#777">bge-m3 生成向量；业务表与向量可 JOIN</text>
    <text x="46" y="372" font-size="8.8" fill="#777">溯源跳转为 P0 硬字段（§3.7）</text>

    <!-- 实体：notes -->
    <rect x="272" y="248" width="176" height="130" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1.2"/>
    <rect x="272" y="248" width="176" height="22" fill="#0071E3"/>
    <text x="360" y="263" font-size="9.8" font-weight="bold" text-anchor="middle" fill="#FFF">notes（结构化笔记）</text>
    <text x="282" y="286" font-size="9" fill="#333">id uuid PK · task_id FK</text>
    <text x="282" y="300" font-size="9" fill="#333">summary · key_points JSON[]</text>
    <text x="282" y="314" font-size="9" fill="#333">five_sections JSON（五段）</text>
    <text x="282" y="328" font-size="9" fill="#333">outline_h2 / h3 · tokens_out</text>
    <text x="282" y="342" font-size="9" fill="#333">schema_version · cached（产物缓存）</text>
    <text x="282" y="360" font-size="8.8" fill="#777">输出受 JSON Schema 契约校验（§3.4）</text>
    <text x="282" y="372" font-size="8.8" fill="#777">命中缓存不重生成，直接降本</text>

    <!-- 实体：cards -->
    <rect x="488" y="248" width="156" height="130" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1.2"/>
    <rect x="488" y="248" width="156" height="22" fill="#6E6E73"/>
    <text x="566" y="263" font-size="9.8" font-weight="bold" text-anchor="middle" fill="#FFF">cards（卡片 / 题目）</text>
    <text x="498" y="286" font-size="9" fill="#333">id uuid PK · note_id FK</text>
    <text x="498" y="300" font-size="9" fill="#333">question · answer · tag</text>
    <text x="498" y="314" font-size="9" fill="#333">unit_id FK（关联知识点）</text>
    <text x="498" y="328" font-size="9" fill="#333">difficulty · source_ts</text>
    <text x="498" y="342" font-size="9" fill="#333">mastery（当前掌握度）</text>
    <text x="498" y="360" font-size="8.8" fill="#777">字段完整率 ≥ 95% 为评测指标</text>
    <text x="498" y="372" font-size="8.8" fill="#777">问答须带来源（§3.7 P0）</text>

    <!-- 实体：review_logs -->
    <rect x="36" y="430" width="196" height="118" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1.2"/>
    <rect x="36" y="430" width="196" height="22" fill="#6E6E73"/>
    <text x="134" y="445" font-size="9.8" font-weight="bold" text-anchor="middle" fill="#FFF">review_logs（复习记录）</text>
    <text x="46" y="468" font-size="9" fill="#333">id uuid PK · user_id FK</text>
    <text x="46" y="482" font-size="9" fill="#333">card_id FK · unit_id FK</text>
    <text x="46" y="496" font-size="9" fill="#333">result（对/错/半对）· elapsed_ms</text>
    <text x="46" y="510" font-size="9" fill="#333">reviewed_at · interval_days</text>
    <text x="46" y="528" font-size="8.8" fill="#777">掌握度模型的唯一事实来源</text>
    <text x="46" y="540" font-size="8.8" fill="#777">见 图 3-10 学习闭环</text>

    <!-- 实体：plans -->
    <rect x="272" y="430" width="176" height="118" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1.2"/>
    <rect x="272" y="430" width="176" height="22" fill="#3A3A3C"/>
    <text x="360" y="445" font-size="9.8" font-weight="bold" text-anchor="middle" fill="#FFF">plans / plan_items（计划）</text>
    <text x="282" y="468" font-size="9" fill="#333">id uuid PK · user_id FK</text>
    <text x="282" y="482" font-size="9" fill="#333">goal · time_window · target_date</text>
    <text x="282" y="496" font-size="9" fill="#333">item_type · card_id / unit_id FK</text>
    <text x="282" y="510" font-size="9" fill="#333">status · rescheduled_from</text>
    <text x="282" y="528" font-size="8.8" fill="#777">重排留痕：可解释、可回放</text>
    <text x="282" y="540" font-size="8.8" fill="#777">AI 依据执行情况重排后续任务</text>

    <!-- 实体：usage / cost -->
    <rect x="488" y="430" width="156" height="118" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1.2"/>
    <rect x="488" y="430" width="156" height="22" fill="#0071E3"/>
    <text x="566" y="445" font-size="9.8" font-weight="bold" text-anchor="middle" fill="#FFF">usage（成本与观测）</text>
    <text x="498" y="468" font-size="9" fill="#333">id uuid PK · task_id FK</text>
    <text x="498" y="482" font-size="9" fill="#333">token_in / token_out</text>
    <text x="498" y="496" font-size="9" fill="#333">latency_ms · cost_cny</text>
    <text x="498" y="510" font-size="9" fill="#333">trace_id · logged_at</text>
    <text x="498" y="528" font-size="8.8" fill="#777">成本看板按日聚合（§5.5）</text>
    <text x="498" y="540" font-size="8.8" fill="#777">超阈值触发降档（§3.3）</text>
  </g>

