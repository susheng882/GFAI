  <rect xmlns="http://www.w3.org/2000/svg" x="36" y="566" width="608" height="96" fill="#F5F5F7" stroke="#1D1D1F" stroke-width="1"/>
  <text xmlns="http://www.w3.org/2000/svg" x="50" y="586" font-size="10" font-weight="bold" fill="#1D1D1F">存储边界（单机 2C4G 下的职责划分）</text>
  <text xmlns="http://www.w3.org/2000/svg" x="50" y="605" font-size="9.6" fill="#333">PostgreSQL 16 + pgvector：全部业务表 + 1024 维向量同库；Alembic 版本化迁移 ◆；产物缓存表避免重复生成。</text>
  <text xmlns="http://www.w3.org/2000/svg" x="50" y="621" font-size="9.6" fill="#333">Redis（maxmemory 256 mb）：任务队列 List、任务态小状态、配额计数、session ◆ —— 只存小状态，产物不进 Redis。</text>
  <text xmlns="http://www.w3.org/2000/svg" x="50" y="637" font-size="9.6" fill="#333">MinIO：原始文件、关键帧、导出物，版本控制（G4）+ 30 天非当前版本清理 ◆；业务表只存 object_key。</text>
  <text xmlns="http://www.w3.org/2000/svg" x="50" y="653" font-size="9.6" fill="#333">本地磁盘 /data/tmp：任务中间产物，单任务 5 GB 配额，终态即清理；水位 80% 冻结入队（§5.7）。</text>

  <rect xmlns="http://www.w3.org/2000/svg" x="36" y="678" width="608" height="134" fill="#FAFAFC" stroke="#999" stroke-width="0.8" stroke-dasharray="5 3"/>
  <text xmlns="http://www.w3.org/2000/svg" x="50" y="698" font-size="9.8" fill="#333">注 1：本图为概念级 ER 视图，字段名与技术方案 §2.1 / §2.5 / §2.7 及工程骨架一致；物理索引与约束以 Alembic 迁移脚本为准。</text>
  <text xmlns="http://www.w3.org/2000/svg" x="50" y="716" font-size="9.8" fill="#333">注 2：选择 pgvector 同库而非 Milvus / ChromaDB：业务表与向量可 JOIN 溯源，单机零运维；Chroma 仅保留为本地离线降级（§2.1）。</text>
  <text xmlns="http://www.w3.org/2000/svg" x="50" y="734" font-size="9.8" fill="#333">注 3：所有 AI 产物经 JSON Schema 契约校验后落库（schema_version 字段留痕），契约失败触发重试与降级（§3.4）。</text>
  <text xmlns="http://www.w3.org/2000/svg" x="50" y="752" font-size="9.8" fill="#333">注 4：时间戳（start_ts/end_ts/source_ts）为溯源跳转的硬字段，跨 notes / cards / knowledge_units 三表贯通，缺字段即判定契约失败。</text>
  <text xmlns="http://www.w3.org/2000/svg" x="50" y="770" font-size="9.8" fill="#333">注 5：usage 表九字段与 trace_id 贯通结构化日志，是 G1/G5 门禁与成本看板的数据来源（§4.3 / §5.5）。</text>
  <text xmlns="http://www.w3.org/2000/svg" x="50" y="788" font-size="9.8" fill="#333">注 6：◆ 为 2026-11-14 架构评审新增项；K1/K2 链路与图 4-1、图 3-2 编号互相锚定。</text>

  <g xmlns="http://www.w3.org/2000/svg" font-size="9.8" fill="#444">
    <rect x="50" y="838" width="14" height="10" fill="#0071E3"/>
    <text x="70" y="847">核心业务实体</text>
    <rect x="160" y="838" width="14" height="10" fill="#A1A1A6"/>
    <text x="180" y="847">辅助 / 观测实体</text>
    <text x="310" y="847">PK 主键　·　FK 外键　·　1 : N 一对多　·　◆ 评审新增</text>
  </g>
