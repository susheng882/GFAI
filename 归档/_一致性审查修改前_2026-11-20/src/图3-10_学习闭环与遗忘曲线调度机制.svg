<text x="455.0" y="105.0" font-size="9.4" fill="#0071E3" font-weight="bold">① 指数遗忘　Ebbinghaus 1885</text>
<text x="437.0" y="120.0" font-size="8.8" fill="#3A3A3C">R(t) = e^(−t/S)</text>
<text x="437.0" y="132.0" font-size="8.8" fill="#3A3A3C">24 h 后 R≈0.3（约损失 70%）</text>
<text x="437.0" y="144.0" font-size="8.8" fill="#3A3A3C">S = 记忆强度 / 稳定性</text>
<rect x="428.0" y="178.0" width="228.0" height="82.0" fill="#EEF5FD" stroke="#1D1D1F" stroke-width="1"/>
<g transform="translate(436.0,184.0) scale(0.72)" fill="none" stroke="#1D1D1F" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 6 L12 12 L16 15"/></g>
<text x="455.0" y="195.0" font-size="9.4" fill="#0071E3" font-weight="bold">② SM-2　Wozniak 1987</text>
<text x="437.0" y="210.0" font-size="8.8" fill="#3A3A3C">I(1)=1, I(2)=6, I(n)=I(n−1)·EF</text>
<text x="437.0" y="222.0" font-size="8.8" fill="#3A3A3C">EF′=EF+0.1−(5−q)(0.08+0.02(5−q))</text>
<text x="437.0" y="234.0" font-size="8.8" fill="#3A3A3C">EF 下限 1.3；答错间隔归 1</text>
<rect x="428.0" y="268.0" width="228.0" height="82.0" fill="#EEF5FD" stroke="#1D1D1F" stroke-width="1"/>
<g transform="translate(436.0,274.0) scale(0.72)" fill="none" stroke="#1D1D1F" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2 L12 5 M12 19 L12 22 M2 12 L5 12 M19 12 L22 12 M5 5 L7 7 M17 17 L19 19 M19 5 L17 7 M7 17 L5 19"/></g>
<text x="455.0" y="285.0" font-size="9.4" fill="#0071E3" font-weight="bold">③ FSRS　Anki 2025-07 默认</text>
<text x="437.0" y="300.0" font-size="8.8" fill="#3A3A3C">R(t,S)=(1+F·t/S)^(−C)</text>
<text x="437.0" y="312.0" font-size="8.8" fill="#3A3A3C">t*=(S/F)(R*^(−1/C)−1)</text>
<text x="437.0" y="324.0" font-size="8.8" fill="#3A3A3C">D/S/R 三参数由历史拟合</text>
<text x="428.0" y="366.0" font-size="9" fill="#B4472F">◆ 本项目主线用可解释的 ①+②，V1.5 评估 ③</text>
