<text x="36.0" y="816.0" font-size="9.0" fill="#48484A">收入侧用户数为规划假设，未做市场调研；成本侧来自 2026-11-14 真实报价（服务器 ¥15.7/月、LLM ¥60/月、域名 ¥6/月）。</text>
<text x="36.0" y="830.0" font-size="8.7" fill="#48484A">免费额度按 0.08–0.12 元/次 × 3 次/月计入（人均 ≈0.3 元/月）；B 区首年按 970 免费用户计 ≈291 元/月，已并入月成本。</text>
<text x="36.0" y="844.0" font-size="9.0" fill="#48484A">结论表述为「小团队可行、单位经济为正、规模待验证」，不宣称市场规模或盈利预测；与 图 2-3 的 SAM/SOM 假设互相引用。</text>
