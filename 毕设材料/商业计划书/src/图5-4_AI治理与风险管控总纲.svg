<text x="36.0" y="811.0" font-size="9.0" fill="#48484A">问：模型出错怎么办？—— 输出契约先拦，评测集回归兜底，指标下降 &gt;3 pp 回滚到上一版本（G4）。</text>
<text x="36.0" y="825.0" font-size="9.0" fill="#48484A">问：账单失控怎么办？—— 日阈值自动降档而非拒绝服务，强档单独配额，超硬超时直接置失败并保留已完成段。</text>
