<text x="392.0" y="679.0" font-size="9.2" fill="#1D1D1F" text-anchor="middle">GFLC 年付 ¥99（≈¥8.25/月）低于全部订阅型竞品，成本依据见技术方案 5.8 与图 7-2、图 7-3。</text>
