<text x="392.0" y="635.0" font-size="9.2" fill="#1D1D1F" text-anchor="middle">间隔重复只有 Anki / RemNote / Recall 触及，且均不接收自有视频与 PDF 解析产物，亦无时间戳溯源回炉。</text>
