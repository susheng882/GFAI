<text x="476.7" y="761.0" font-size="9.6" fill="#1D1D1F" font-weight="bold">链路衔接</text>
<text x="458.7" y="777.0" font-size="8.5" fill="#3A3A3C">materials 落库后与图 4-3 的 K2 入队</text>
