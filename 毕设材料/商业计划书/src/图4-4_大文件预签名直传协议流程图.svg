<line x1="120.0" y1="518.0" x2="120.0" y2="548.0" stroke="#D2D2D7" stroke-width="0.4"/>
<line x1="320.0" y1="518.0" x2="320.0" y2="548.0" stroke="#D2D2D7" stroke-width="0.4"/>
<text x="30.0" y="536.0" font-size="9.4" fill="#1D1D1F" font-weight="bold">签发入参</text>
<text x="126.0" y="536.0" font-size="9.0" fill="#1D1D1F">文件名 / 大小 / MIME / 用户配额</text>
<text x="326.0" y="536.0" font-size="9.0" fill="#1D1D1F">服务端按白名单 MIME 与 UPLOAD_MAX 校验，不信任客户端声明</text>
<rect x="24.0" y="548.0" width="632.0" height="30.0" fill="#F5F5F7" stroke="#A1A1A6" stroke-width="0.6"/>
<line x1="120.0" y1="548.0" x2="120.0" y2="578.0" stroke="#D2D2D7" stroke-width="0.4"/>
<line x1="320.0" y1="548.0" x2="320.0" y2="578.0" stroke="#D2D2D7" stroke-width="0.4"/>
<text x="30.0" y="566.0" font-size="9.4" fill="#1D1D1F" font-weight="bold">预签名 URL</text>
<text x="126.0" y="566.0" font-size="9.0" fill="#1D1D1F">PUT 限定 object_key，15 min 有效</text>
<text x="326.0" y="566.0" font-size="9.0" fill="#1D1D1F">最小权限：只能写这一个 key，不能列举 / 删除桶内对象</text>
<rect x="24.0" y="578.0" width="632.0" height="30.0" fill="#FFFFFF" stroke="#A1A1A6" stroke-width="0.6"/>
<line x1="120.0" y1="578.0" x2="120.0" y2="608.0" stroke="#D2D2D7" stroke-width="0.4"/>
<line x1="320.0" y1="578.0" x2="320.0" y2="608.0" stroke="#D2D2D7" stroke-width="0.4"/>
<text x="30.0" y="596.0" font-size="9.4" fill="#1D1D1F" font-weight="bold">直传通道</text>
<text x="126.0" y="596.0" font-size="9.0" fill="#1D1D1F">浏览器 → MinIO（Nginx 反代）</text>
<text x="326.0" y="596.0" font-size="9.0" fill="#1D1D1F">字节流不进 API 进程，两个并发 1 GB 上传不打爆 4 GB 内存</text>
<rect x="24.0" y="608.0" width="632.0" height="30.0" fill="#F5F5F7" stroke="#A1A1A6" stroke-width="0.6"/>
<line x1="120.0" y1="608.0" x2="120.0" y2="638.0" stroke="#D2D2D7" stroke-width="0.4"/>
<line x1="320.0" y1="608.0" x2="320.0" y2="638.0" stroke="#D2D2D7" stroke-width="0.4"/>
<text x="30.0" y="626.0" font-size="9.4" fill="#1D1D1F" font-weight="bold">confirm 校验</text>
<text x="126.0" y="626.0" font-size="9.0" fill="#1D1D1F">以 MinIO HEAD/stat 的 size / ETag 为准</text>
<text x="326.0" y="626.0" font-size="9.0" fill="#1D1D1F">防「客户端声称成功但对象不完整」；不一致标记失败并清理</text>
<rect x="24.0" y="638.0" width="632.0" height="30.0" fill="#FFFFFF" stroke="#A1A1A6" stroke-width="0.6"/>
<line x1="120.0" y1="638.0" x2="120.0" y2="668.0" stroke="#D2D2D7" stroke-width="0.4"/>
<line x1="320.0" y1="638.0" x2="320.0" y2="668.0" stroke="#D2D2D7" stroke-width="0.4"/>
<text x="30.0" y="656.0" font-size="9.4" fill="#1D1D1F" font-weight="bold">磁盘治理</text>
<text x="126.0" y="656.0" font-size="9.0" fill="#1D1D1F">水位 ≥80% 冻结；单任务 ≤5 GB</text>
<text x="326.0" y="656.0" font-size="9.0" fill="#1D1D1F">与 5.7 节磁盘水位告警、临时文件清理联动</text>
<rect x="24.0" y="668.0" width="632.0" height="30.0" fill="#F5F5F7" stroke="#A1A1A6" stroke-width="0.6"/>
<line x1="120.0" y1="668.0" x2="120.0" y2="698.0" stroke="#D2D2D7" stroke-width="0.4"/>
<line x1="320.0" y1="668.0" x2="320.0" y2="698.0" stroke="#D2D2D7" stroke-width="0.4"/>
<text x="30.0" y="686.0" font-size="9.4" fill="#1D1D1F" font-weight="bold">幂等与版本</text>
<text x="126.0" y="686.0" font-size="9.0" fill="#1D1D1F">object_key = task_id + 内容哈希</text>
<text x="326.0" y="686.0" font-size="9.0" fill="#1D1D1F">重复 confirm 不产生第二条 materials；开启桶版本控制</text>
<rect x="24.0" y="698.0" width="632.0" height="30.0" fill="#FFFFFF" stroke="#A1A1A6" stroke-width="0.6"/>
<line x1="120.0" y1="698.0" x2="120.0" y2="728.0" stroke="#D2D2D7" stroke-width="0.4"/>
<line x1="320.0" y1="698.0" x2="320.0" y2="728.0" stroke="#D2D2D7" stroke-width="0.4"/>
<text x="30.0" y="716.0" font-size="9.4" fill="#1D1D1F" font-weight="bold">失败分支</text>
<text x="126.0" y="716.0" font-size="9.0" fill="#1D1D1F">超配额 / 水位冻结 / stat 不符 / 过期</text>
<text x="326.0" y="716.0" font-size="9.0" fill="#1D1D1F">统一返回明确错误码，前端展示「部分成功」而非静默吞掉</text>
<text x="24.0" y="738.0" font-size="10.5" fill="#0071E3" font-weight="bold">C　评审动机、信任边界与链路衔接</text>
<rect x="24.0" y="744.0" width="205.3" height="66.0" fill="#EEF5FD" stroke="#1D1D1F" stroke-width="0.8"/>
<g transform="translate(31.0,749.0) scale(0.62)" fill="none" stroke="#1D1D1F" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2 L22 21 L2 21 Z"/><path d="M12 9 L12 15"/><circle cx="12" cy="18" r="0.9" fill="#0071E3"/></g>
<text x="50.0" y="761.0" font-size="9.6" fill="#1D1D1F" font-weight="bold">评审动机</text>
<text x="32.0" y="777.0" font-size="8.5" fill="#3A3A3C">隐含的 Nginx → FastAPI 上传路径会让</text>
<text x="32.0" y="790.0" font-size="8.5" fill="#3A3A3C">1 GB 视频流经 API 进程；而「上传文件</text>
<text x="32.0" y="803.0" font-size="8.5" fill="#3A3A3C">优先」是核心入口策略，必须绕开</text>
<rect x="237.3" y="744.0" width="205.3" height="66.0" fill="#EEF5FD" stroke="#1D1D1F" stroke-width="0.8"/>
<g transform="translate(244.3,749.0) scale(0.62)" fill="none" stroke="#1D1D1F" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2 L21 6 L21 12 C21 17 17 21 12 22 C7 21 3 17 3 12 L3 6 Z"/><path d="M8 12 L11 15 L16 9"/></g>
<text x="263.3" y="761.0" font-size="9.6" fill="#1D1D1F" font-weight="bold">信任边界</text>
<text x="245.3" y="777.0" font-size="8.5" fill="#3A3A3C">客户端不可信：大小、类型、成功状态</text>
<text x="245.3" y="790.0" font-size="8.5" fill="#3A3A3C">一律以服务端校验与对象存储 stat 为准；</text>
<text x="245.3" y="803.0" font-size="8.5" fill="#3A3A3C">预签名 URL 限定单 key 与短时效</text>
<rect x="450.7" y="744.0" width="205.3" height="66.0" fill="#EEF5FD" stroke="#1D1D1F" stroke-width="0.8"/>
