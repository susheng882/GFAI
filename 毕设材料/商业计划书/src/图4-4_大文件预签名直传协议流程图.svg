<text x="126.0" y="509.0" font-size="9.0" fill="#FFFFFF" font-weight="bold">协议约定</text>
<text x="326.0" y="509.0" font-size="9.0" fill="#FFFFFF" font-weight="bold">理由与落点</text>
<line x1="120.0" y1="492.0" x2="120.0" y2="518.0" stroke="#FFFFFF" stroke-width="0.4"/>
<line x1="320.0" y1="492.0" x2="320.0" y2="518.0" stroke="#FFFFFF" stroke-width="0.4"/>
