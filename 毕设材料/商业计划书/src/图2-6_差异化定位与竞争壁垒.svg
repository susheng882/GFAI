<text x="56.0" y="670.0" font-size="9.4" fill="#1D1D1F" font-weight="bold">定位结论</text>
<text x="36.0" y="687.0" font-size="9.0" fill="#48484A">差异化不建立在功能数量上（可被快速跟随），而建立在「同一条可验证数据链」上：每个知识产物都能回到原始素材、进入复习排程、并留下掌握度证据。</text>
<text x="36.0" y="701.0" font-size="9.0" fill="#48484A">L1 数据链是最难复制的一层；L4 成本优势会被跟随，故答辩陈述以 L1–L3 为主、L4 为佐证。</text>
